<style>
/* Layout: one-screen toy. The picture lives inside a robot-cat "head" bezel; tray of sockets and glossy keycap columns below. Light studio world, single theme by choice. */
:root{
  --studio:#e8f3f1; --studio-deep:#cfe4e1; --ink:#1e3037; --muted:#5d7a81;
  --visor:#121718; --visor-2:#2a3235; --cyan:#35c6d9; --glow:#9ff1fb;
  --star:#ffb928; --star-edge:#c98a17; --star-off:#cfdcdc;
  --t-easy:#22a06b; --t-normal:#2a86cf; --t-hard:#e8700f; --t-expert:#d42f58;
  --display:'Mochiy Pop One','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --body:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(130% 75% at 50% 0%,#ffffff 0%,var(--studio) 55%,var(--studio-deep) 100%);background-color:var(--studio);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;box-sizing:border-box;padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:var(--body);cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

/* ---------- shared bits ---------- */
.ib{position:relative;flex:none;width:40px;height:40px;border-radius:13px;border:0;padding:0;background:linear-gradient(180deg,#ffffff,#e4eeed);box-shadow:0 3px 0 #c2d5d7,0 6px 12px rgba(40,90,100,.12),inset 0 1px 0 #fff;display:grid;place-items:center;color:var(--ink);transition:transform .1s,opacity .2s}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #c2d5d7,0 3px 6px rgba(40,90,100,.12)}
.ib svg{width:20px;height:20px}
.ib.off{opacity:.45}
.badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;box-sizing:border-box;padding:0 5px;border-radius:10px;background:var(--ink);color:#fff;font-family:var(--display);font-size:10px;line-height:19px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.btn{border:0;border-radius:16px;padding:14px 16px;font-weight:800;font-size:16px;letter-spacing:.04em;transition:transform .1s}
.btn:active{transform:translateY(3px)}
.btn.visor{background:linear-gradient(180deg,var(--visor-2),var(--visor));color:var(--glow);text-shadow:0 0 10px rgba(80,220,240,.75);box-shadow:0 4px 0 #050708,0 12px 20px rgba(10,30,35,.25),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.soft{background:linear-gradient(180deg,#ffffff,#e4eeed);color:var(--ink);box-shadow:0 4px 0 #c2d5d7,0 8px 14px rgba(40,90,100,.12),inset 0 1px 0 #fff}
.tier{flex:none;display:inline-block;font-family:var(--display);font-size:10px;line-height:1;color:#fff;border-radius:99px;padding:4px 8px 3px;background:var(--tc,var(--ink));letter-spacing:.04em;white-space:nowrap}
.t-easy{--tc:var(--t-easy)} .t-normal{--tc:var(--t-normal)} .t-hard{--tc:var(--t-hard)} .t-expert{--tc:var(--t-expert)}
.stars{display:inline-flex;gap:1px;align-items:center}
.stars svg{width:14px;height:14px;fill:var(--star-off)}
.stars svg.on{fill:var(--star);filter:drop-shadow(0 1px 0 var(--star-edge))}

/* ---------- keycap blocks ---------- */
.key{--c:#ccc;--hi:#eee;--lo:#999;position:relative;display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1.7;border:0;padding:0;border-radius:16px;
  background:linear-gradient(180deg,var(--hi) 0%,var(--c) 50%,var(--c) 100%);
  box-shadow:0 5px 0 var(--lo),0 10px 16px rgba(30,70,80,.2),inset 0 2px 1px rgba(255,255,255,.75),inset 0 -4px 8px rgba(0,0,0,.1);transition:transform .12s,box-shadow .12s,opacity .2s}
.key::before{content:"";position:absolute;left:9%;right:9%;top:6%;height:40%;border-radius:12px 12px 50% 50%/12px 12px 100% 100%;background:linear-gradient(rgba(255,255,255,.72),rgba(255,255,255,0));pointer-events:none}
.key{--tx:#fff;--tl:var(--lo)}
.key span{position:relative;font-family:var(--display);font-size:clamp(16px,5vw,22px);line-height:1;color:var(--tx);font-variant-numeric:tabular-nums;
  text-shadow:0 2px 0 var(--tl),2px 0 0 var(--tl),-2px 0 0 var(--tl),0 -2px 0 var(--tl),1.5px 1.5px 0 var(--tl),-1.5px 1.5px 0 var(--tl),1.5px -1.5px 0 var(--tl),-1.5px -1.5px 0 var(--tl),0 4px 5px rgba(0,0,0,.18)}
.key.can::after{content:"";position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:#6dff9e;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 9px 2px rgba(80,255,150,.85)}
.lamp{display:inline-block;width:9px;height:9px;border-radius:50%;background:#6dff9e;box-shadow:0 0 0 2px #fff,0 0 8px 2px rgba(80,255,150,.85);margin:0 3px;vertical-align:1px}
.col .key.r0:active{transform:translateY(4px);box-shadow:0 1px 0 var(--lo),0 3px 6px rgba(30,70,80,.2),inset 0 2px 1px rgba(255,255,255,.75)}
.col .key.r1{transform:scale(.92);pointer-events:none;box-shadow:0 4px 0 var(--lo),0 6px 10px rgba(30,70,80,.14),inset 0 2px 1px rgba(255,255,255,.75)}
.col .key.r3{transform:scale(.84);pointer-events:none;box-shadow:0 3px 0 var(--lo),0 4px 8px rgba(30,70,80,.12),inset 0 2px 1px rgba(255,255,255,.75)}
.col .key.r2{transform:scale(.88);pointer-events:none;box-shadow:0 3px 0 var(--lo),0 4px 8px rgba(30,70,80,.12),inset 0 2px 1px rgba(255,255,255,.75)}
.col .key.rise{animation:rise .28s cubic-bezier(.3,1.4,.5,1)}
.col .key.reveal{animation:reveal .55s cubic-bezier(.3,1.3,.5,1)}
.key.hint{outline:3px solid var(--cyan);outline-offset:4px;animation:hintPulse .9s ease-in-out infinite}
@keyframes hintPulse{50%{outline-offset:8px;outline-color:rgba(53,198,217,.35)}}
@keyframes rise{from{transform:translateY(14px) scale(.92)}}
@keyframes reveal{from{transform:scale(.93) rotateY(90deg);filter:brightness(1.7)}}

/* ---------- home ---------- */
#home{overflow-y:auto;gap:16px;-webkit-overflow-scrolling:touch}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px}
.logo .pk{font-family:var(--display);font-size:13px;letter-spacing:.3em;padding:5px 12px 5px 16px;border-radius:99px;background:linear-gradient(180deg,var(--visor-2),var(--visor));color:var(--glow);text-shadow:0 0 8px rgba(80,220,240,.8)}
.logo h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,44px);line-height:1.1;letter-spacing:.02em;color:var(--ink);text-shadow:0 3px 0 #fff,0 6px 14px rgba(40,90,100,.18);text-wrap:balance}
.hero{position:relative;display:flex;justify-content:center;height:clamp(130px,22vh,200px);flex:none}
.hero .cpbox{height:100%;aspect-ratio:846/934;position:relative;z-index:1;cursor:pointer}
.hero .floor{position:absolute;bottom:-4px;left:50%;width:46%;height:16px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(40,90,100,.25),rgba(40,90,100,0));animation:shadow 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-1.5deg)}}
@keyframes shadow{50%{transform:translateX(-50%) scaleX(.85);opacity:.7}}
.summary{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;flex:none}
.pill{border:0;font-size:13px;font-weight:800;height:40px;padding:0 14px;border-radius:13px;background:linear-gradient(180deg,#ffffff,#e4eeed);box-shadow:0 3px 0 #c2d5d7,0 6px 12px rgba(40,90,100,.12),inset 0 1px 0 #fff;display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;box-sizing:border-box}
.pill svg{width:18px;height:18px;fill:var(--star);filter:drop-shadow(0 1px 0 var(--star-edge))}
.pill b{font-family:var(--display);font-weight:400;font-size:15px}
.tiers{display:flex;flex-direction:column;gap:18px;padding-bottom:6px}
.tsec{display:flex;flex-direction:column;gap:10px}
.thead{display:flex;align-items:center;gap:8px;padding:0 2px;min-width:0}
.thead .tier{font-size:12px;padding:6px 11px 5px}
.thead p{margin:0;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;border:0;text-align:left;background:linear-gradient(180deg,#ffffff,#edf4f3);border-radius:22px;padding:9px 9px 10px;box-shadow:0 4px 0 #c6d8d9,0 10px 18px rgba(40,90,100,.12),inset 0 1px 0 #fff;display:flex;flex-direction:column;gap:7px;transition:transform .12s;min-width:0}
.card:active{transform:translateY(3px)}
.card .scr{background:#0e1c1f;border-radius:14px;padding:8px;aspect-ratio:1;box-shadow:inset 0 2px 8px rgba(0,0,0,.6);position:relative;overflow:hidden;box-sizing:border-box}
.card .scr::after{content:"";position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%);pointer-events:none}
.card canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;border-radius:3px}
.card .t{display:flex;align-items:center;gap:7px;padding:0 3px;min-width:0}
.card .n{flex:none;font-family:var(--display);font-size:11px;color:#fff;background:var(--ink);border-radius:99px;padding:2px 8px}
.card .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .sub{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 3px}
.card .sz{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- game ---------- */
#game{gap:10px}
.bar{display:flex;align-items:center;gap:8px;position:relative;z-index:5;flex:none}
.who{position:relative;width:42px;height:46px;flex:none}
.who .cpbox{position:absolute;inset:0;display:flex;align-items:center}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes hop{40%{transform:translateY(-9px) scale(1.05,.95)}}
.bubble{position:absolute;left:2px;top:52px;white-space:nowrap;background:linear-gradient(180deg,var(--visor-2),var(--visor));color:var(--glow);font-weight:800;font-size:12px;padding:7px 11px;border-radius:12px;box-shadow:0 6px 14px rgba(10,30,35,.3);z-index:8;text-shadow:0 0 6px rgba(80,220,240,.6);animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
.bubble::before{content:"";position:absolute;left:15px;top:-6px;border:6px solid transparent;border-top:0;border-bottom-color:var(--visor-2)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sname{display:flex;align-items:center;gap:6px;min-width:0}
.mrow{display:flex;align-items:center;gap:6px;min-width:0}
.mrow .tier{font-size:9px;padding:3px 6px 2px}
.mrow .meter{flex:1;min-width:0}
.sname b{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sname .pct{margin-left:auto;flex:none;font-family:var(--display);font-size:13px;color:#1a9fb2;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:99px;background:#d2e1e0;box-shadow:inset 0 2px 3px rgba(40,80,90,.28),0 1px 0 #fff;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(180deg,#a5f0f8,#27b5c9);box-shadow:inset 0 1px 0 rgba(255,255,255,.7);transition:width .25s}

#stageArea{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:20px}
.head{position:relative}
.ear{position:absolute;top:-26px;width:76px;height:64px;z-index:0;pointer-events:none}
.ear.l{left:6px}
.ear.r{right:6px;transform:scaleX(-1)}
.bezel{position:relative;z-index:1;padding:12px;border-radius:32px;
  background:radial-gradient(120% 95% at 28% 8%,#ffffff 0%,#f4f9f9 45%,#d9e8e8 100%);
  box-shadow:inset 0 2px 0 #fff,inset 0 -6px 12px rgba(110,150,160,.28),0 18px 30px rgba(40,90,100,.2),0 0 0 1.5px rgba(160,192,197,.7)}
.screenwrap{position:relative;padding:6px;border-radius:18px;background:#0e1c1f;line-height:0}
#pic{display:block}
.gloss{position:absolute;inset:0;border-radius:18px;pointer-events:none;background:linear-gradient(140deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.05) 26%,rgba(255,255,255,0) 38%);box-shadow:inset 0 3px 10px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.06)}

.tray{flex:none;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:8px;padding:9px;border-radius:22px;background:linear-gradient(180deg,#ffffff,#e3eeed);box-shadow:inset 0 1px 0 #fff,0 8px 18px rgba(40,90,100,.14),0 0 0 1.5px rgba(170,200,204,.6)}
.tray.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.well{position:relative;aspect-ratio:1;max-height:76px;width:100%;justify-self:center;border-radius:14px;background:linear-gradient(180deg,#cddcdb,#e8f0ef);box-shadow:inset 0 3px 6px rgba(50,90,100,.32),inset 0 -1px 0 #fff;padding:3px 3px 6px;display:flex;box-sizing:border-box}
.well .key{aspect-ratio:auto;height:100%;border-radius:12px;box-shadow:0 3px 0 var(--lo),0 5px 8px rgba(30,70,80,.18),inset 0 2px 1px rgba(255,255,255,.75),inset 0 -3px 6px rgba(0,0,0,.1);cursor:default}
.well .key span{font-size:clamp(14px,4.2vw,19px)}
.well.waiting .key{box-shadow:0 3px 0 var(--lo),inset 0 0 0 2px rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.1)}
.well.waiting::after{content:"zz";position:absolute;top:-9px;right:-3px;font-family:var(--display);font-size:11px;color:var(--muted);background:#fff;border-radius:99px;padding:1px 5px;box-shadow:0 2px 4px rgba(0,0,0,.15);animation:zz 1.6s ease-in-out infinite}
@keyframes zz{50%{transform:translateY(-3px)}}
.well .key.bye{animation:bye .3s ease-in forwards}
@keyframes bye{40%{transform:scale(1.15)}to{transform:scale(.2);opacity:0}}
.well.extra{background:linear-gradient(180deg,#bfeaf0,#e3f7f9)}

.cols{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 4px}
.col{display:flex;flex-direction:column;gap:5px;align-items:center;min-width:0;perspective:400px}
.ghost{width:100%;aspect-ratio:1.7;border-radius:16px;border:2px dashed rgba(93,122,129,.22);box-sizing:border-box}
.more{font-weight:800;font-size:11px;color:var(--muted);height:13px;line-height:13px;font-variant-numeric:tabular-nums}
#fx{position:absolute;inset:0;pointer-events:none;z-index:12}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(214,234,231,.55);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);overflow-y:auto}
.sheet{width:min(340px,100%);box-sizing:border-box;margin:auto;background:linear-gradient(180deg,#ffffff,#eff6f5);border-radius:28px;padding:20px 20px 18px;box-shadow:0 26px 50px rgba(30,70,80,.26),0 0 0 1.5px rgba(170,200,204,.6),inset 0 1px 0 #fff;text-align:center;display:flex;flex-direction:column;gap:11px;animation:pop .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;text-wrap:balance}
.sheet p{margin:0;font-size:14px;line-height:1.7;color:var(--muted);font-weight:700;text-wrap:pretty}
.sheet p.note{font-size:12px;line-height:1.6}
.sheet .pic{height:112px;display:flex;justify-content:center}
.sheet .pic .cpbox{height:100%;aspect-ratio:846/934}
@keyframes cheer{30%{transform:translateY(-14px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.bigstars{display:flex;justify-content:center;gap:6px;margin-top:-4px}
.bigstars svg{width:44px;height:44px;fill:var(--star-off)}
.bigstars svg.on{fill:var(--star);filter:drop-shadow(0 3px 0 var(--star-edge));animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both}
.bigstars svg.on:nth-child(2){animation-delay:.15s}
.bigstars svg.on:nth-child(3){animation-delay:.3s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:800;padding:5px 11px;border-radius:99px;background:#e2eeed;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.gold{background:linear-gradient(180deg,#ffe58a,#ffbf3d);color:#5a3a00}
.steps{display:flex;flex-direction:column;gap:12px;text-align:left}
.step{display:flex;gap:12px;align-items:flex-start}
.step i{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:13px;color:var(--glow);background:linear-gradient(180deg,var(--visor-2),var(--visor))}
.step div{font-size:14px;line-height:1.6;font-weight:700}
.step small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.nw{white-space:nowrap}
.tierlist{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;text-align:left;font-size:12px;font-weight:700;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <section id="home" class="screen" aria-label="ステージをえらぶ">
    <div class="logo"><span class="pk">パクパク</span><h1>チャッピー</h1></div>
    <div class="hero"><div class="cpbox" id="heroChappy" title="チャッピー"></div></div>
    <div class="summary">
      <span class="pill" id="starTotal"></span>
      <button class="pill" id="howBtn" type="button">あそびかた</button>
      <button class="ib snd" id="sndHome" type="button" aria-label="音のオンオフ"></button>
    </div>
    <div class="tiers" id="tiers"></div>
  </section>

  <section id="game" class="screen" hidden>
    <header class="bar">
      <button class="ib" id="toHome" type="button" aria-label="ステージ一覧にもどる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg></button>
      <div class="who" id="who"><div class="cpbox" id="whoChappy"></div><div class="bubble" id="bubble" hidden></div></div>
      <div class="meta">
        <div class="sname"><b id="sName"></b><span class="pct" id="pct">0%</span></div>
        <div class="mrow"><span class="tier" id="sTier"></span><div class="meter"><i id="meter"></i></div></div>
      </div>
      <button class="ib" id="hintBtn" type="button" aria-label="ヒント"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span class="badge" id="hintBadge" hidden></span></button>
      <button class="ib snd" id="sndGame" type="button" aria-label="音のオンオフ"></button>
    </header>

// reachable pixels of its colour in lockstep rounds until nothing can move. Same moves → same result.
function Heap(r){this.a=[];this.r=r}

const tileCache=new Map();
function tile(hex,cd){const key=hex+cd;let t=tileCache.get(key);if(t)return t;
  t=document.createElement('canvas');t.width=t.height=cd;const c=t.getContext('2d');
  // the seam between beads is a darker shade of the bead itself, so fine grids keep their colour
  c.fillStyle=mix(hex,'#000000',.3);c.fillRect(0,0,cd,cd);
  const small=cd<13,g=cd>=7?Math.max(1,Math.round(cd*.06)):0,r=cd*(small?.32:.27),s=cd-2*g;
  const gr=c.createLinearGradient(0,g,0,g+s);gr.addColorStop(0,mix(hex,'#ffffff',small?.16:.3));gr.addColorStop(.5,hex);gr.addColorStop(1,mix(hex,'#000000',small?.12:.2));
  c.fillStyle=gr;rr(c,g,g,s,s,r);c.fill();
  if(!small){c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(g+s*.34,g+s*.28,s*.2,s*.11,-.5,0,7);c.fill()}
  else if(cd>=8){c.fillStyle='rgba(255,255,255,.28)';c.beginPath();c.arc(g+s*.33,g+s*.3,s*.13,0,7);c.fill()}
  tileCache.set(key,t);return t}

  const imgs=[...svg.querySelectorAll('image')];let left=imgs.length;const cv=document.createElement('canvas');cv.width=SW;cv.height=SH;const c=cv.getContext('2d');
  const loaded=imgs.map(im=>{const o=new Image();o.onload=()=>{if(--left===0){
      // draw in document order (ears behind head)
      loaded.forEach((L,i)=>{const e=imgs[i];c.drawImage(L,(+e.getAttribute('x')-VB[0])*k,(+e.getAttribute('y')-VB[1])*k,+e.getAttribute('width')*k,+e.getAttribute('height')*k)});

  const availW=a.width-2*(12+6)-4,availH=a.height-20-2*(12+6)-4;
  const cd=Math.max(3,Math.floor(Math.min(availW,availH)/Math.max(G.W,G.H)*dpr));
  G.cd=cd;G.cell=cd/dpr;G.catSize=Math.max(17,Math.min(30,G.cell*2.6));
  pic.width=G.W*cd;pic.height=G.H*cd;pic.style.width=G.W*cd/dpr+'px';pic.style.height=G.H*cd/dpr+'px';
  const r=game.getBoundingClientRect();
  fx.width=Math.round(r.width*dpr);fx.height=Math.round(r.height*dpr);fx.style.width=r.width+'px';fx.style.height=r.height+'px';
  fctx.setTransform(dpr,0,0,dpr,0,0);G.fxW=r.width;G.fxH=r.height;
  cachePos();drawAll()}
function cachePos(){const g=game.getBoundingClientRect(),p=pic.getBoundingClientRect();

const pixPos=k=>({x:G.picR.x+((k%G.W)+.5)*G.cell,y:G.picR.y+(((k/G.W)|0)+.5)*G.cell});

  for(let k=0;k<G.N;k++){if(G.veaten[k]){hole(k);continue}c.drawImage(tile(G.st.pal[G.grid[k]],cd),(k%G.W)*cd,((k/G.W)|0)*cd)}}

  if(cd>=10){pctx.fillStyle='rgba(70,210,230,.15)';pctx.beginPath();pctx.arc(x+cd/2,y+cd/2,Math.max(.8,cd*.08),0,7);pctx.fill()}}

function searchHint(){const E=G.E,fr=E.fronts().sort((a,b)=>G.pos[E.cols[a][0].id]-G.pos[E.cols[b][0].id]);
  for(const i of fr){const f=E.clone();f.place(i);if(f.done()||playPlan(f))return i}
  const R=rngFrom((Math.random()*1e9)|0);
  for(const i of fr)for(let r=0;r<3;r++){const f=E.clone();f.place(i);if(f.done()||playSmart(f,R))return i}
  let best=fr[0],bs=-Infinity;for(const i of fr){const v=scoreMove(E,i);if(v>bs){bs=v;best=i}}return best}

  if(G.pending){const busy=G.cats.some(c=>c.phase!=='back')||G.slots.some(s=>s&&s.qp<s.queue.length);
    if(!busy){if(G.pending==='win'){G.state='win';setTimeout(win,500)}
      else{G.state='stuck';Snd.lose();whoMood('think');say('おなかいっぱい…？');setTimeout(lose,700)}}}}

// ---------- loop ----------
let last=performance.now();
function frame(now){const dt=Math.min(50,now-last);last=now;
  if(G&&!game.hidden){update(dt);draw(now)}requestAnimationFrame(frame)}
function update(dt){
  if(G.state==='play')G.time+=dt;
  for(const s of G.slots){if(!s)continue;
    if(s.qp<s.queue.length){s.cd-=dt;
      while(s.cd<=0&&s.inflight<MAXFLY&&s.qp<s.queue.length){spawnCat(s,s.queue[s.qp++]);s.disp++;s.inflight++;s.cd+=G.D}
      if(s.cd<0)s.cd=0}
    const left=s.n-s.disp;if(s.el&&s.shown!==left){s.shown=left;s.el.firstChild.textContent=left||''}}
  for(let i=G.cats.length-1;i>=0;i--){const c=G.cats[i];c.t+=dt;if(c.t<c.dur)continue;
    if(c.phase==='go'){c.phase='munch';c.t=0;c.dur=140;land(c)}
    else if(c.phase==='munch'){c.phase='back';c.t=0;c.dur=220+c.d*.9;c.dir=-c.dir}
    else{G.cats[i]=G.cats[G.cats.length-1];G.cats.pop()}}
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life-=dt;if(p.life<=0){G.parts[i]=G.parts[G.parts.length-1];G.parts.pop();continue}
    p.vy+=1100*dt/1000;p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000}
  for(let i=G.conf.length-1;i>=0;i--){const p=G.conf[i];p.life-=dt;if(p.life<=0){G.conf.splice(i,1);continue}
    p.vy+=520*dt/1000;p.vx*=.995;p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.rot+=p.vr*dt/1000}
  if(G.dirty){G.dirty=false;progress()}
  G.chk-=dt;if(G.chk<=0){G.chk=200;periodic()}}
function draw(now){fctx.clearRect(0,0,G.fxW||0,G.fxH||0);
  for(const p of G.parts){fctx.globalAlpha=Math.min(1,p.life/p.max*1.6);fctx.fillStyle=p.hex;fctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz)}
  fctx.globalAlpha=1;
  for(const c of G.cats)c.y=catPos(c).y;
  const cats=G.cats.slice().sort((a,b)=>a.y-b.y);
  for(const c of cats)drawCat(c,now);
  for(const p of G.conf){fctx.save();fctx.globalAlpha=Math.min(1,p.life/600);fctx.translate(p.x,p.y);fctx.rotate(p.rot);
    fctx.fillStyle=p.hex;fctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.rot*1.7)));fctx.restore()}
  fctx.globalAlpha=1}
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function catPos(c){if(c.phase==='munch')return c.p2;const e=ease(Math.min(1,c.t/c.dur));return bez(c.p0,c.p1,c.p2,c.phase==='go'?e:1-e)}
function drawCat(c){const S=G.catSize,pos=catPos(c);let hop=0,sx=1,sy=1,rot=0,alpha=1;
  if(c.phase!=='munch'){const u=Math.min(1,c.t/c.dur),e=ease(u);
    const ph=e*c.d/(S*.62)+c.seed;hop=Math.abs(Math.sin(ph*Math.PI))*S*.2;rot=Math.sin(ph*Math.PI*2)*.09;
    const sq=1-Math.abs(Math.sin(ph*Math.PI));sx=1+sq*.07;sy=1-sq*.07;
    if(c.phase==='back'&&u>.78)alpha=Math.max(0,(1-u)/.22)}
  else{const u=c.t/c.dur;sy=1-Math.sin(u*Math.PI*2)*.13;sx=1+Math.sin(u*Math.PI*2)*.09}
  fctx.save();fctx.globalAlpha=alpha;fctx.translate(pos.x,pos.y);
  fctx.fillStyle=rgba(c.hex,.45);fctx.beginPath();fctx.ellipse(0,S*.44,S*.34,S*.09,0,0,7);fctx.fill();
  fctx.translate(0,-hop);fctx.rotate(rot);
  if(c.phase==='munch'){const u=c.t/c.dur,ts=Math.max(4,G.cell*(1-u*.45));
    fctx.drawImage(tile(c.hex,G.cd),-ts/2+S*.02,-S*.55*u-ts/2-S*.1*u,ts,ts)}
  fctx.save();fctx.scale(c.dir*sx,sy);{const sp=catSprite(c.hex),h=S*sp.height/sp.width;fctx.drawImage(sp,-S/2,-h*.62,S,h)}fctx.restore();
  if(c.phase==='back'){const cs=Math.max(5,Math.min(S*.4,G.cell*1.15));fctx.drawImage(tile(c.hex,G.cd),-cs/2-S*.04,-S*.5-cs*.62,cs,cs)}
  fctx.restore()}

// ---------- bubble ----------
let bubT=0;
function say(text,ms=1600){const b=$('#bubble');b.textContent=text;b.hidden=false;b.style.animation='none';void b.offsetWidth;b.style.animation='';
  clearTimeout(bubT);bubT=setTimeout(()=>b.hidden=true,ms)}

// ---------- overlays ----------
function openOv(html,cls){const s=$('#sheet');s.className='sheet '+(cls||'');s.innerHTML=html;$('#ov').hidden=false;$('#ov').scrollTop=0;
  const box=s.querySelector('.pic .cpbox');if(box){s._cp=Chappy.mount(box,{mood:cls==='win'?'happy':(cls==='lose'?'think':'normal'),label:false});if(cls==='win'){Chappy.play(s._cp,'jump');setTimeout(()=>s._cp&&Chappy.play(s._cp,'wave'),1000)}}
  const f=s.querySelector('button');if(f)f.focus({preventScroll:true});return s}
function hideOv(){$('#ov').hidden=true}
const fmt=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function win(){if(!G||G.state!=='win'||game.hidden)return;Snd.win();whoMood('happy');whoPlay('jump');
  const stars=G.rescueUsed?1:(G.hintUsed?2:3);const prev=clears[G.st.id]||{};const newBest=!!prev.best&&G.time<prev.best;
  clears[G.st.id]={stars:Math.max(prev.stars||0,stars),best:Math.min(prev.best||1e12,G.time)};store.set('clears',clears);window.CGCBridge&&CGCBridge.report({board:G.st.id,boardName:'ステージ「'+G.st.name+'」',score:Math.round(G.time)});
  confetti();
  const lastSt=G.i===STAGES.length-1;
  const note=stars===3?'ヒントもトレイ追加も使わずにクリア！':stars===2?'ヒントを使わずにクリアすると ★3':'トレイを増やさずにクリアすると ★2';
  const s=openOv(`<div class="pic"><div class="cpbox"></div></div>${starRow(stars,'bigstars')}<h2>ごちそうさま！</h2>
    <p>「${G.st.name}」をぜんぶ食べきったよ</p>
    <div class="stats"><span class="chip">${G.E.placed.length} 手</span><span class="chip">タイム ${fmt(G.time)}</span>${newBest?'<span class="chip gold">ベスト更新</span>':''}</div>
    <p class="note">${note}</p>
    <button class="btn visor" id="nx" type="button">${lastSt?'ステージ一覧へ':'つぎのステージへ'}</button>
    <button class="btn soft" id="again" type="button">べつの配置で遊ぶ</button>`,'win');
  s.querySelector('#nx').onclick=()=>{if(lastSt)goHome();else startStage(G.i+1)};
  s.querySelector('#again').onclick=()=>startStage(G.i)}
function lose(){if(!G||G.state!=='stuck'||game.hidden)return;
  const s=openOv(`<div class="pic"><div class="cpbox"></div></div><h2>おなかいっぱい…？</h2>
    <p>トレイのどの色も、まだ下から届かないよ。出す順番を見直してみよう。</p>
    ${G.rescueUsed?'':'<button class="btn visor" id="res" type="button">トレイを1つ増やしてつづける</button><p class="note">トレイを増やすと、クリアしても ★1 になるよ</p>'}
    <button class="btn ${G.rescueUsed?'visor':'soft'}" id="re" type="button">おなじ配置でやり直す</button>
    <button class="btn soft" id="hm" type="button">ステージ一覧へ</button>`,'lose');
  const res=s.querySelector('#res');if(res)res.onclick=rescue;
  s.querySelector('#re').onclick=()=>startStage(G.i,'same');s.querySelector('#hm').onclick=goHome}
function rescue(){whoMood('normal');G.rescueUsed=true;G.E.S++;G.slots.push(null);G.pending=null;G.state='play';hideOv();renderTray();cachePos();say('トレイが増えたよ！')}
function howTo(){const s=openOv(`<h2>あそびかた</h2><div class="steps">
    <div class="step"><i>1</i><div>手前のブロックをタップ<small>ブロックが上のトレイに入り、同じ色のチャッピーが数字のぶんだけ出動するよ</small></div></div>
    <div class="step"><i>2</i><div>チャッピーは絵の下から食べる<small>ピクセルは、そのすぐ下が食べられてはじめて届くよ</small></div></div>
    <div class="step"><i>3</i><div>届かない色はトレイで待機<small>トレイ5つが待機ブロックで埋まったら詰み。どの順番で出すかがすべて</small></div></div>
    <div class="step"><i>★</i><div>ヒントもトレイ追加も使わずにクリアで ★3<small><span class="lamp"></span>がついたブロックは、今すぐ食べられる色だよ</small></div></div></div>
    <div class="tierlist">${TORDER.map(t=>`<span class="tier t-${t}">${TIER[t].label}</span><span>${TIER[t].desc}${TIER[t].hints===Infinity?'':'<span class="nw">（ヒント'+TIER[t].hints+'回）</span>'}</span>`).join('')}</div>
    <button class="btn visor" id="ok" type="button">わかった！</button>`);
  s.querySelector('#ok').onclick=hideOv}
function confetti(){const cols=Object.values(G.st.pal).concat(['#35c6d9','#ffd95a','#e9473b']);
  for(let i=0;i<150;i++){const a=-Math.PI/2+(Math.random()-.5)*1.6,v=380+Math.random()*520;
    G.conf.push({x:(G.fxW||360)/2+(Math.random()-.5)*60,y:(G.fxH||700)*.42,vx:Math.cos(a)*v,vy:Math.sin(a)*v,rot:Math.random()*6,vr:(Math.random()-.5)*14,
      w:5+Math.random()*5,h:8+Math.random()*6,hex:cols[(Math.random()*cols.length)|0],life:2200+Math.random()*1200})}}

// ---------- home ----------
function thumb(st){const cv=el('canvas');cv.width=st.W;cv.height=st.H;const c=cv.getContext('2d'),img=c.createImageData(st.W,st.H);
  st.rows.forEach((row,y)=>{for(let x=0;x<row.length;x++){const[r,g,b]=rgb(st.pal[row[x]]),o=(y*st.W+x)*4;img.data[o]=r;img.data[o+1]=g;img.data[o+2]=b;img.data[o+3]=255}});
  c.putImageData(img,0,0);return cv}
function buildHome(){const box=$('#tiers');box.innerHTML='';let total=0;
  for(const t of TORDER){const list=STAGES.map((s,i)=>[s,i]).filter(([s])=>s.tier===t);if(!list.length)continue;
    const sec=el('section','tsec'),head=el('div','thead');
    head.innerHTML=`<span class="tier t-${t}">${TIER[t].label}</span><p>${TIER[t].desc}</p>`;sec.append(head);
    const cards=el('div','cards');
    for(const[st,i]of list){const cl=clears[st.id],stars=cl?cl.stars||0:0;total+=stars;
      const b=el('button','card');b.type='button';b.setAttribute('aria-label',`ステージ${i+1} ${st.name}（${TIER[t].label}）`);
      const scr=el('div','scr');scr.append(thumb(st));b.append(scr);
      b.insertAdjacentHTML('beforeend',`<div class="t"><span class="n">${i+1}</span><span class="nm">${st.name}</span></div><div class="sub"><span class="sz">${st.W}×${st.H}・${Object.keys(st.pal).length}色</span>${starRow(stars,'stars')}</div>`);
      b.onclick=()=>startStage(i);cards.append(b)}
    sec.append(cards);box.append(sec)}
  $('#starTotal').innerHTML=`${STAR} <b>${total}</b> / ${STAGES.length*3}`}
function goHome(){hideOv();if(G)G.state='off';buildHome();show('home')}

$('#toHome').onclick=goHome;$('#hintBtn').onclick=hint;$('#howBtn').onclick=()=>{Snd.init();howTo()};
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&$('#sheet').querySelector('#ok'))hideOv()});
let rz=0;const relayout=()=>{clearTimeout(rz);rz=setTimeout(layout,120)};
addEventListener('resize',relayout);
if(window.ResizeObserver)new ResizeObserver(relayout).observe($('#stageArea'));
document.addEventListener('visibilitychange',()=>{last=performance.now()});
buildHome();show('home');requestAnimationFrame(frame);
})();
</script>

</body></html>
