<style>
  :root{
    --paper:#F3EDE0; --ink:#23201B; --frame:#4A3B2E; --cy:#4fd6ff; --gold:#ffcb45;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#051005;
    font-family:var(--gothic);color:var(--ink);overscroll-behavior:none}
  canvas{display:block}

  /* ── HUD ── */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;
    padding:calc(env(safe-area-inset-top) + 12px) 14px;
    display:flex;justify-content:space-between;align-items:flex-start}
  .panel{font-family:var(--mincho);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.9);
    letter-spacing:.08em;line-height:1.35}
  .panel .lab{font-size:10px;opacity:.8;letter-spacing:.14em}
  .panel b{font-size:27px;font-weight:600}
  .panel .sm{font-size:13px;opacity:.9}
  #timerPanel{text-align:right}
  #timerPanel.warn b{color:#ffd24a}
  #timerPanel.danger b{color:#ff6a5a;animation:blink .6s steps(2,end) infinite}
  @keyframes blink{50%{opacity:.35}}

  /* さがすヒント（方向＆距離） */
  #radar{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:5;pointer-events:none;
    display:flex;align-items:center;gap:9px;background:rgba(8,14,10,.5);
    border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 15px;
    font-family:var(--mincho);color:#fff;font-size:12px;letter-spacing:.1em;
    text-shadow:0 1px 4px rgba(0,0,0,.8);opacity:0;transition:opacity .3s}
  #radar.on{opacity:1}
  #arrow{width:19px;height:19px;flex:0 0 auto;transition:transform .16s ease-out}
  #radar.near{border-color:var(--cy);color:#cffaff}
  #radar.hot{border-color:var(--gold);color:#fff0c2}

  #net{position:fixed;left:50%;top:50%;width:124px;height:124px;margin:-62px 0 0 -62px;
    pointer-events:none;z-index:5;transition:transform .1s ease}
  #net.swing{transform:scale(.72)}
  #net .ring{fill:none;stroke:rgba(255,255,255,.36);stroke-width:2}
  #net .mesh{stroke:rgba(255,255,255,.16);stroke-width:.7;fill:none}
  #net.on .ring{stroke:var(--cy);stroke-width:3}
  #net.on .mesh{stroke:rgba(79,214,255,.45)}
  #net.gold .ring{stroke:var(--gold);stroke-width:3.4}

  #target{position:fixed;left:0;right:0;top:calc(50% + 78px);text-align:center;z-index:5;
    font-family:var(--mincho);font-size:15px;letter-spacing:.16em;color:#eaffff;
    text-shadow:0 1px 6px rgba(0,0,0,.9);opacity:0;transition:opacity .12s}
  #target.on{opacity:1}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:10px;
    justify-content:center;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom) + 18px)}
  button{font-family:var(--gothic);font-size:16px;border:none;cursor:pointer}
  #catch{pointer-events:auto;background:var(--paper);color:var(--ink);border-radius:999px;
    padding:16px 46px;letter-spacing:.2em;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.55)}
  #catch:active{transform:translateY(2px)}
  #catch:disabled{opacity:.45}

  #pop{position:fixed;left:50%;top:44%;z-index:7;text-align:center;
    font-family:var(--mincho);letter-spacing:.08em;color:#fff;font-weight:700;
    text-shadow:0 2px 12px rgba(0,0,0,.7);opacity:0;pointer-events:none;white-space:nowrap}
  #pop .t{font-size:26px}
  #pop .p{font-size:15px;color:var(--cy)}
  #pop.gold .p{color:var(--gold)}
  #pop.hit{animation:pop .85s ease-out}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.5)}
    22%{opacity:1;transform:translate(-50%,-14px) scale(1.1)}
    62%{opacity:1;transform:translate(-50%,-30px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-72px) scale(1)}}
  #pop{transform:translate(-50%,0)}

  .over{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:20px;padding:30px;text-align:center;overflow:auto;
    background:radial-gradient(120% 90% at 50% 16%,#5cc0ea 0%,#2a6f96 42%,#0c2333 100%)}
  .over h1{margin:0;font-family:var(--mincho);color:#fff;font-weight:600;font-size:25px;
    letter-spacing:.26em;text-indent:.26em}
  .over p{margin:0;max-width:24em;line-height:1.95;color:#e6f4fb;font-size:13.5px;letter-spacing:.03em}
  .big{font-family:var(--mincho);color:#fff;font-size:60px;font-weight:700;line-height:1.05}
  .big small{font-size:20px;opacity:.85;font-weight:500}
  .btn{background:#fff;color:var(--ink);border-radius:999px;padding:16px 44px;
    letter-spacing:.22em;font-weight:700;font-family:var(--mincho);font-size:17px;pointer-events:auto}
  .note{font-size:11px;color:#bcd7e6;letter-spacing:.04em;line-height:1.8}
  #load{color:#dbeaf2;font-size:12px;letter-spacing:.2em;font-family:var(--mincho)}
  #result{display:none}
  .rank{font-family:var(--mincho);font-size:19px;color:#ffe58a;letter-spacing:.16em}
  .brk{font-family:var(--mincho);color:#dceaf3;font-size:13px;line-height:2;
    border-top:1px solid rgba(255,255,255,.2);border-bottom:1px solid rgba(255,255,255,.2);
    padding:10px 0;min-width:15em}
  .brk i{font-style:normal;float:right;color:#fff;font-weight:600}
  /* 図鑑（キャラ種別の説明） */
  .kinds{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-family:var(--mincho);
    font-size:11.5px;color:#e2f0f8;letter-spacing:.04em}
  .kind{display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
</style>
</head>
<body>

<video id="vid" playsinline muted autoplay
  style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none;background:#111"></video>

<div id="hud">
  <div class="panel">
    <span class="lab">つかまえた</span><br>
    <b><span id="found">0</span></b><span class="sm"> / <span id="total">20</span></span>
  </div>
  <div class="panel" id="timerPanel">
    <span class="lab">のこり</span><br><b><span id="time">3:00</span></b>
    <div class="sm">とくてん <span id="score">0</span></div>
  </div>
</div>

<div id="radar">
  <svg id="arrow" viewBox="0 0 24 24"><path d="M12 2 L19 20 L12 15.5 L5 20 Z" fill="currentColor"/></svg>
  <span id="rtext">さがしています</span>
</div>

<svg id="net" viewBox="0 0 124 124">
  <circle class="ring" cx="62" cy="62" r="50"/>
  <g class="mesh"><path d="M12 62H112M62 12V112"/><circle cx="62" cy="62" r="33"/>
    <circle cx="62" cy="62" r="16"/><path d="M27 27 97 97M97 27 27 97"/></g>
</svg>
<div id="target"></div>
<div id="pop"><div class="t">みつけた！</div><div class="p">+1</div></div>

<div class="bar"><button id="catch">つかまえる</button></div>

<div id="start" class="over">
  <h1>チャッピーさがし</h1>
  <p id="lead">読み込み中…</p>
  <div class="kinds">
    <span class="kind"><i class="dot" style="background:#ffffff"></i>ふつう +1</span>
    <span class="kind"><i class="dot" style="background:#bfe9ff"></i>ちいさい +3</span>
    <span class="kind"><i class="dot" style="background:#7be3a0"></i>すばやい +5</span>
    <span class="kind"><i class="dot" style="background:#ffcb45"></i>きんいろ +10</span>
  </div>
  <button class="btn" id="go" style="display:none">はじめる</button>
  <div class="note" id="note"></div>
</div>

<div id="result" class="over">
  <h1 id="rtitle">おわり！</h1>
  <div class="big"><span id="fscore">0</span><small> てん</small></div>
  <div class="rank" id="rank"></div>
  <div class="brk" id="brk"></div>
  <p id="rmsg"></p>
  <button class="btn" id="again">もういちど</button>
</div>

let MODE='desktop', scene, camera, renderer, controls;
const clock=new THREE.Clock();
const vid=document.getElementById('vid');
const leadEl=document.getElementById('lead'), noteEl=document.getElementById('note');
const goBtn=document.getElementById('go');

async function detectMode(){
  if(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false)) MODE='xr';
  else if(/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) MODE='ios';
  else MODE='desktop';
}

/* ══════════════════════════════════════════════════════════════
   Three.js 基本
   ══════════════════════════════════════════════════════════════ */
function initThree(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.05, 400);
  camera.position.set(0,CFG.EYE_HEIGHT,0);
  renderer=new THREE.WebGLRenderer({antialias:!isMobile, alpha:true, powerPreference:'high-performance'});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(isMobile ? Math.min(devicePixelRatio,1.5) : Math.min(devicePixelRatio,2));
  renderer.setClearColor(0x000000,0);
  renderer.shadowMap.enabled=!isMobile; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.xr.enabled=(MODE==='xr');
  renderer.domElement.style.cssText='position:fixed;inset:0;z-index:1';
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xc2d8e4,1.30));
  const sun=new THREE.DirectionalLight(0xfff2d8,1.75);
  sun.position.set(6,15,4); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{near:0.5,far:70,left:-26,right:26,top:26,bottom:-26});
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0xdff0ff,0x415a2a,0.5));

  addEventListener('resize',()=>{
    if(MODE==='xr'&&renderer.xr.isPresenting) return;
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}

/* ══════════════════════════════════════════════════════════════
   森（隠れ場所を増やして探索性を上げる）
   ══════════════════════════════════════════════════════════════ */
function buildForest(){
  if(MODE!=='xr'){
    const ground=new THREE.Mesh(new THREE.CircleGeometry(CFG.FIELD*4,56),
      new THREE.MeshStandardMaterial({color:0x2f5220,roughness:0.96}));
    ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
  }else{
    const sg=new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.ShadowMaterial({opacity:0.24}));
    sg.rotation.x=-Math.PI/2; sg.receiveShadow=true; scene.add(sg);
  }
  const R = MODE==='xr' ? CFG.SPREAD_XR+3 : CFG.FIELD;
  // 下草
  const blade=new THREE.ConeGeometry(0.06,0.6,4);
  const bmat=new THREE.MeshStandardMaterial({color:0x3f6326,roughness:1});
  const gr=new THREE.InstancedMesh(blade,bmat,700), m=new THREE.Object3D();
  for(let i=0;i<700;i++){
    const a=Math.random()*6.283, r=1+Math.random()*R;
    m.position.set(Math.cos(a)*r,0.3,Math.sin(a)*r);
    m.rotation.set(0,Math.random()*6.283,(Math.random()-.5)*0.35);
    const s=0.6+Math.random()*1.3; m.scale.set(s,s,s); m.updateMatrix(); gr.setMatrixAt(i,m.matrix);
  }
  scene.add(gr);
  // 木＋しげみ（かくれ場所）
  const treeCount = isMobile ? Math.floor(CFG.TREE_COUNT*0.6) : CFG.TREE_COUNT;
  for(let i=0;i<treeCount;i++){
    const a=Math.random()*6.283, r=2.2+Math.random()*R;
    scene.add(makeTree(Math.cos(a)*r,Math.sin(a)*r));
  }
  const bushMat=new THREE.MeshStandardMaterial({color:0x2c5a26,roughness:0.9});
  for(let i=0;i<26;i++){
    const a=Math.random()*6.283, r=1.5+Math.random()*R;
    const bush=new THREE.Group();
    for(let k=0;k<3;k++){
      const s=0.42+Math.random()*0.4;
      const b=new THREE.Mesh(new THREE.SphereGeometry(s,10,8),bushMat);
      b.position.set((Math.random()-.5)*0.7,s*0.75,(Math.random()-.5)*0.7);
      b.castShadow=true; bush.add(b);
    }
    bush.position.set(Math.cos(a)*r,0,Math.sin(a)*r); scene.add(bush);
  }
}
function makeTree(x,z){
  const t=new THREE.Group(), h=3.0+Math.random()*2.2;
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.20,0.36,h,8),
    new THREE.MeshStandardMaterial({color:0x5d3d1e,roughness:0.92}));
  tr.position.y=h/2; tr.castShadow=tr.receiveShadow=true; t.add(tr);
  const lm=new THREE.MeshStandardMaterial({color:0x2f6d2a,roughness:0.86});
  for(let i=0;i<3;i++){
    const c=new THREE.Mesh(new THREE.ConeGeometry(1.85-i*0.34,2.3,8),lm);
    c.position.y=h*0.78+i*1.15; c.castShadow=true; t.add(c);
  }
  t.position.set(x,0,z); t.rotation.y=Math.random()*6.283; return t;
}

     ヘルメット 幅0.584 高0.456（中心y=0.602） / 体 幅0.467 高0.374
     黒画面 = 頭幅の0.875 / 耳 高0.170（先端y=1.0）
   ══════════════════════════════════════════════════════════════ */
const P={                     // 実測プロポーション（robot.png 基準・全高=1.0）
  hx:0.3355, hy:0.2410, hz:0.2680,  // ヘルメット半径(x,y,z)  H/W=0.719
  hcy:0.621,                        // ヘルメット中心の高さ
  bx:0.3445, by:0.1900, bz:0.2550,  // 体の半径（頭幅とほぼ同じ幅）
  bcy:0.190,
  earW:0.174, earH:0.138, earX:0.189, earY:0.845, earD:0.075,  // 耳は横に広い三角
  faceW:0.765,                      // 黒画面の幅 / 頭幅（左右に白フチ11.7%）
  faceAspect:0.682,                 // 黒画面 高/幅

};

let FACE_TEX=null;
function makeFaceTexture(){
  const img=new Image();
  const tex=new THREE.Texture(img);
  tex.anisotropy=4; tex.flipY=true;
  img.onload=()=>{ tex.needsUpdate=true; };
  img.src=FACE_URI;
  return tex;
}
/* 頂点を角丸キューブへ寄せる（t=0で球、t=1で立方体） */
function applyRoundedCube(geo,t){
  const p=geo.attributes.position, v=new THREE.Vector3(), n=new THREE.Vector3(), q=new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.set(p.getX(i),p.getY(i),p.getZ(i));
    const r=v.length()||1; n.copy(v).divideScalar(r);
    const mx=Math.max(Math.abs(n.x),Math.abs(n.y),Math.abs(n.z))||1;
    q.copy(n).multiplyScalar(1/mx);
    n.lerp(q,t).multiplyScalar(r);
    p.setXYZ(i,n.x,n.y,n.z);
  }
  p.needsUpdate=true; geo.computeVertexNormals(); return geo;
}
/* 耳＝板状の丸い三角（横に広い・先は丸め。コーンでないので横から尖って飛び出さない） */
function earPlateGeo(w,h,depth){
  const s=new THREE.Shape();
  s.moveTo(-w/2,0);
  s.quadraticCurveTo(-w*0.30,h*0.72, 0,h);       // 左辺→先端（先は丸め）
  s.quadraticCurveTo( w*0.30,h*0.72, w/2,0);     // 先端→右辺
  s.quadraticCurveTo(0,-h*0.22, -w/2,0);         // 付け根はゆるいカーブ
  return new THREE.ExtrudeGeometry(s,{depth:depth,bevelEnabled:true,
    bevelThickness:0.014,bevelSize:0.014,bevelSegments:3,curveSegments:16});
}

function buildChappy(kind){
  const g=new THREE.Group();
  const white=new THREE.MeshStandardMaterial({color:kind.tint, roughness:0.34, metalness:0.06,
    emissive:kind.glow||0x000000, emissiveIntensity:kind.glow?0.28:0});
  const cyan =new THREE.MeshStandardMaterial({color:0x8fe0f4, roughness:0.42,
    side:THREE.DoubleSide, emissive:0x2a6a80, emissiveIntensity:0.35});

  /* ── 体（小さめ・実測比） ── */
  const body=new THREE.Mesh(applyRoundedCube(new THREE.SphereGeometry(1,22,18),0.22), white);
  body.scale.set(P.bx,P.by,P.bz); body.position.y=P.bcy; body.castShadow=true; g.add(body);

  /* ── 足（2本に分かれて立つ・短くてずんぐり） ── */
  const feet=[];
  [-1,1].forEach(s=>{
    const f=new THREE.Mesh(new THREE.SphereGeometry(1,12,10), white);
    f.scale.set(0.105,0.062,0.130); f.position.set(s*0.135,0.055,0.030);
    f.castShadow=true; g.add(f); feet.push(f);
  });
  /* ── 手（体の横に小さな突起） ── */
  const arms=[];
  [-1,1].forEach(s=>{
    const arm=new THREE.Mesh(new THREE.SphereGeometry(1,12,10), white);
    arm.scale.set(0.062,0.098,0.062); arm.position.set(s*0.330,0.215,0.02);
    arm.castShadow=true; g.add(arm); arms.push(arm);
  });

  /* ── 頭（角丸ヘルメット） ── */
  const head=new THREE.Group(); head.position.y=P.hcy; g.add(head);
  const helm=new THREE.Mesh(applyRoundedCube(new THREE.SphereGeometry(1,44,36),P.HEAD_T), white);
  helm.scale.set(P.hx,P.hy,P.hz); helm.castShadow=true; head.add(helm);

  /* ── 顔（オリジナル画像を頭の前面カーブに沿って貼る） ── */
  const capW=Math.min(0.97,P.faceW/0.973);               // 画像内の黒の占有率で補正
  const phiH=Math.asin(capW);                            // 単位球の半角（横）: 幅比=sin(phiH)
  const capH=capW*P.faceAspect*(P.hx/P.hy);              // 縦の比（画像の縦横比を保つ）
  const thetaH=Math.asin(Math.min(0.97,capH));
  const faceGeo=new THREE.SphereGeometry(1,52,40,
    Math.PI*0.5-phiH, phiH*2, Math.PI*0.5-thetaH, thetaH*2);
  applyRoundedCube(faceGeo,P.HEAD_T);
  faceGeo.scale(P.hx*1.022,P.hy*1.022,P.hz*1.022);       // わずかに前へ（突き抜け防止）
  const face=new THREE.Mesh(faceGeo,
    new THREE.MeshBasicMaterial({map:FACE_TEX,transparent:true,depthWrite:false}));
  face.position.y=P.faceDY; face.renderOrder=2; head.add(face);

  /* ── 耳（板状・前面に水色） ── */
  [-1,1].forEach(s=>{
    const ear=new THREE.Group();
    const shell=new THREE.Mesh(earPlateGeo(P.earW,P.earH,P.earD), white);
    shell.position.z=-P.earD/2; shell.castShadow=true; ear.add(shell);
    const inner=new THREE.Mesh(earPlateGeo(P.earW*0.50,P.earH*0.56,0.010), cyan);
    inner.position.set(0,P.earH*0.16,P.earD/2+0.003);    // 前面に貼る＝横から飛び出さない
    ear.add(inner);
    ear.position.set(s*P.earX,P.earY-P.hcy,0);
    ear.rotation.z=-s*0.13;                              // 先を外へわずかに倒す
    head.add(ear);
  });

  /* ── しっぽ＋リンゴ（長い細いS字・リンゴは頭の横上） ── */
  const curve=new THREE.CatmullRomCurve3([
    new THREE.Vector3( 0.14,0.16,-0.18),
    new THREE.Vector3( 0.30,0.13,-0.30),
    new THREE.Vector3( 0.42,0.36,-0.33),
    new THREE.Vector3( 0.44,0.64,-0.28),
    new THREE.Vector3( 0.42,0.84,-0.22),
  ]);
  const tail=new THREE.Mesh(new THREE.TubeGeometry(curve,28,0.020,8,false), white);
  tail.castShadow=true; g.add(tail);
  const apple=new THREE.Group(); apple.position.set(0.42,0.915,-0.21); g.add(apple);
  const ap=new THREE.Mesh(new THREE.SphereGeometry(0.078,16,14),
    new THREE.MeshStandardMaterial({color:0xe23b2e,roughness:0.26,metalness:0.12}));
  ap.scale.set(1,0.93,1); ap.castShadow=true; apple.add(ap);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.007,0.007,0.052,5),
    new THREE.MeshStandardMaterial({color:0x4a3018}));
  stem.position.y=0.085; stem.rotation.z=0.20; apple.add(stem);
  const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.028,8,8),
    new THREE.MeshStandardMaterial({color:0x3f8f34}));
  leaf.scale.set(1.8,0.3,0.9); leaf.position.set(0.034,0.098,0); leaf.rotation.z=-0.5; apple.add(leaf);

  g.userData.feet=feet; g.userData.arms=arms;
  return g;
}

/* ══════════════════════════════════════════════════════════════
   配置 ── 最小間隔を守って広く散らす（密集防止）
   ══════════════════════════════════════════════════════════════ */
const cats=[];
function spreadRadius(){ return MODE==='xr' ? CFG.SPREAD_XR : CFG.FIELD*0.85; }
function farEnough(x,z,list,gap){
  for(const c of list){ const dx=c.x-x, dz=c.z-z; if(dx*dx+dz*dz < gap*gap) return false; }
  return true;
}
function placeChappies(){
  const R=spreadRadius(), spots=[];
  let gap=CFG.MIN_GAP;
  for(let i=0;i<TOTAL;i++){
    let p=null;
    for(let tries=0;tries<220;tries++){
      // 面積で一様に散らす（中心に寄らない）＋最低距離2.5mは離す
      const a=Math.random()*6.283, r=Math.sqrt(Math.random())*R;
      const rr=Math.max(2.5,r);
      const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
      if(farEnough(x,z,spots,gap)){ p={x,z}; break; }
      if(tries===160) gap*=0.75;             // 詰まったら間隔を緩める
    }
    if(!p){ const a=Math.random()*6.283, rr=2.5+Math.random()*R; p={x:Math.cos(a)*rr,z:Math.sin(a)*rr}; }
    spots.push(p);
  }
  let idx=0;
  for(const kind of KINDS){
    for(let k=0;k<kind.n;k++){
      const c=buildChappy(kind), p=spots[idx++];
      const sc=0.55*kind.size;                        // 実寸およそ0.55m×種別倍率
      c.scale.setScalar(sc);
      c.position.set(p.x,0,p.z);
      c.rotation.y=Math.random()*6.283;
      Object.assign(c.userData,{
        kind, caught:false, baseScale:sc,
        phase:Math.random()*6.283,
        speed:kind.speed[0]+Math.random()*(kind.speed[1]-kind.speed[0]),
        fleeing:0, tired:0, stamina:0, wait:Math.random()*1.5,
      });
      pickTarget(c);
      scene.add(c); cats.push(c);
    }
  }
}
function pickTarget(c){
  const R=spreadRadius();
  const a=Math.random()*6.283, r=1.5+Math.random()*R;
  c.userData.tx=Math.cos(a)*r; c.userData.tz=Math.sin(a)*r;
  c.userData.wait=0.4+Math.random()*1.8;
}
/* 歩く・逃げる */
function moveCat(c,dt,px,pz){
  const u=c.userData;
  const dxp=c.position.x-px, dzp=c.position.z-pz;
  const dp=Math.hypot(dxp,dzp);
  // すばやい／きんいろは近づかれると逃げる（ただし体力があり、疲れて止まる）
  if(u.kind.flee && dp<CFG.FLEE_DIST && u.tired<=0){
    u.fleeing=0.8; u.stamina=(u.stamina||0)+dt;
    u.tx=c.position.x+dxp/(dp||1)*5; u.tz=c.position.z+dzp/(dp||1)*5; u.wait=0;
    if(u.stamina>2.2){ u.tired=1.8; u.stamina=0; u.fleeing=0; u.wait=1.8; }  // 息切れ＝つかまえる好機
  } else {
    if(u.fleeing>0) u.fleeing-=dt;
    if(u.tired>0) u.tired-=dt; else u.stamina=Math.max(0,(u.stamina||0)-dt*0.5);
  }
  if(u.wait>0){ u.wait-=dt; return false; }
  const dx=u.tx-c.position.x, dz=u.tz-c.position.z, d=Math.hypot(dx,dz);
  if(d<0.2){ pickTarget(c); return false; }
  const sp=u.speed*(u.fleeing>0?1.55:1);
  const step=Math.min(sp*dt,d);
  c.position.x+=dx/d*step; c.position.z+=dz/d*step;
  const want=Math.atan2(dx,dz);
  let diff=want-c.rotation.y; while(diff>Math.PI)diff-=6.283; while(diff<-Math.PI)diff+=6.283;
  c.rotation.y+=diff*Math.min(1,dt*7);
  return true;
}

/* ══════════════════════════════════════════════════════════════
   向き（非XR）
   ══════════════════════════════════════════════════════════════ */
const deg=Math.PI/180;
let orient=null, yaw=0, pit=0;
function onOrient(e){
  if(e.alpha===null&&e.beta===null&&e.gamma===null) return;
  orient={alpha:(e.alpha||0)*deg,beta:(e.beta||0)*deg,gamma:(e.gamma||0)*deg};
}
const _zee=new THREE.Vector3(0,0,1), _eu=new THREE.Euler();
const _q0=new THREE.Quaternion(), _q1=new THREE.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2);
function applyOrientation(){
  if(!orient){ camera.rotation.set(pit,yaw,0,'YXZ'); return; }
  const scr=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*deg;
  _eu.set(orient.beta,orient.alpha,-orient.gamma,'YXZ');
  camera.quaternion.setFromEuler(_eu);
  camera.quaternion.multiply(_q1);
  camera.quaternion.multiply(_q0.setFromAxisAngle(_zee,-scr));
}

/* ══════════════════════════════════════════════════════════════
   照準・さがすヒント
   ══════════════════════════════════════════════════════════════ */
const _v=new THREE.Vector3(), fwd=new THREE.Vector3(), camPos=new THREE.Vector3();
let hover=null, nearest=null, nearestDist=1e9;
const netEl=document.getElementById('net'), targetEl=document.getElementById('target');
const radarEl=document.getElementById('radar'), arrowEl=document.getElementById('arrow'), rtextEl=document.getElementById('rtext');

function updateAim(){
  if(MODE==='xr'&&renderer.xr.isPresenting){ try{ renderer.xr.getCamera(camera); }catch(e){} }
  camera.getWorldPosition(camPos);
  camera.getWorldDirection(fwd);
  const flat=new THREE.Vector3(fwd.x,0,fwd.z).normalize();
  let best=Math.cos(CFG.CATCH_ANGLE*deg), pick=null;
  nearest=null; nearestDist=1e9;
  for(const c of cats){
    if(c.userData.caught) continue;
    const dx=c.position.x-camPos.x, dz=c.position.z-camPos.z;
    const dist=Math.hypot(dx,dz);
    if(dist<nearestDist){ nearestDist=dist; nearest=c; }
    if(dist>CFG.CATCH_DIST) continue;
    const dot=(dx/dist)*flat.x+(dz/dist)*flat.z;
    if(dot>best){ best=dot; pick=c; }
  }
  hover=pick;
  const gold=hover&&hover.userData.kind.key==='gold';
  netEl.classList.toggle('on',!!hover&&gameActive);
  netEl.classList.toggle('gold',!!gold&&gameActive);
  if(hover&&gameActive){ targetEl.textContent=hover.userData.kind.name; targetEl.classList.add('on'); }
  else targetEl.classList.remove('on');

  // ヒント：いちばん近い個体の方向と距離
  if(gameActive&&nearest){
    const dx=nearest.position.x-camPos.x, dz=nearest.position.z-camPos.z;
    const ang=Math.atan2(dx,dz)-Math.atan2(flat.x,flat.z);
    arrowEl.style.transform='rotate('+(ang*180/Math.PI)+'deg)';
    rtextEl.textContent=nearestDist<CFG.CATCH_DIST?'すぐそこ！':(nearestDist<6?'ちかい':'とおい')+'　'+nearestDist.toFixed(0)+'m';
    radarEl.classList.add('on');
    radarEl.classList.toggle('near',nearestDist<6&&nearestDist>=CFG.CATCH_DIST);
    radarEl.classList.toggle('hot',nearestDist<CFG.CATCH_DIST);
  } else radarEl.classList.remove('on');
}

/* ══════════════════════════════════════════════════════════════
   ループ
   ══════════════════════════════════════════════════════════════ */
function tick(){
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  camera.getWorldPosition(camPos);
  for(const c of cats){
    if(c.userData.caught) continue;
    const moving=gameActive?moveCat(c,dt,camPos.x,camPos.z):false;
    // てくてく歩き（体の上下＋足の交互）
    const sp=moving?(c.userData.fleeing>0?13:7):0;
    c.position.y=moving?Math.abs(Math.sin(t*sp+c.userData.phase))*0.022:0;
    if(c.userData.feet){
      const a=Math.max(0,Math.sin(t*sp+c.userData.phase))*0.035;
      const b=Math.max(0,Math.sin(t*sp+c.userData.phase+Math.PI))*0.035;
      c.userData.feet[0].position.y=0.048+(moving?a:0);
      c.userData.feet[1].position.y=0.048+(moving?b:0);
    }
    if(c.userData.arms){    // 手をふる
      const w=moving?Math.sin(t*sp+c.userData.phase)*0.35:Math.sin(t*1.6+c.userData.phase)*0.12;
      c.userData.arms[0].rotation.z=w; c.userData.arms[1].rotation.z=-w;
    }
  }
  if(MODE==='xr'&&renderer.xr.isPresenting){}
  else if(MODE==='ios') applyOrientation();  // ← 先にカメラ向きを確定
  else if(controls) controls.update();
  updateAim();  // ← 確定した向きで照準判定
  renderer.render(scene,camera);
}

/* ══════════════════════════════════════════════════════════════
   ゲーム進行（点数・コンボ・結果）
   ══════════════════════════════════════════════════════════════ */
let gameActive=false, timeLeft=CFG.TIME_SEC, found=0, score=0, timerId=null;
let lastCatchAt=-99, combo=0;
const counts={};
const popEl=document.getElementById('pop'), foundEl=document.getElementById('found');
const timeEl=document.getElementById('time'), scoreEl=document.getElementById('score');
const timerPanel=document.getElementById('timerPanel'), catchBtn=document.getElementById('catch');
document.getElementById('total').textContent=TOTAL;

/* 効果音（WebAudio・音源ファイル不要） */
let AC=null;
function beep(freq,dur,type){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22,AC.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur+0.02);
  }catch(e){}
}
const fmt=s=>((s/60|0)+':'+String(s%60).padStart(2,'0'));

function startGame(){
  gameActive=true; timeLeft=CFG.TIME_SEC; found=0; score=0; combo=0; lastCatchAt=-99;
  for(const k of KINDS) counts[k.key]=0;
  foundEl.textContent='0'; scoreEl.textContent='0'; timeEl.textContent=fmt(timeLeft);
  timerPanel.classList.remove('warn','danger');
  catchBtn.disabled=false;
  clearInterval(timerId);
  timerId=setInterval(()=>{
    timeLeft--; timeEl.textContent=fmt(Math.max(0,timeLeft));
    if(timeLeft<=30) timerPanel.classList.add('warn');
    if(timeLeft<=10){ timerPanel.classList.add('danger'); if(timeLeft>0) beep(880,0.07,'square'); }
    if(timeLeft<=0) endGame();
  },1000);
}
function endGame(){
  gameActive=false; clearInterval(timerId); catchBtn.disabled=true;
  netEl.classList.remove('on','gold'); targetEl.classList.remove('on'); radarEl.classList.remove('on');
  document.getElementById('fscore').textContent=score;
  window.CGCBridge && CGCBridge.report({ board:'main', boardName:'とくてん', score });
  const perfect=found>=TOTAL;
  document.getElementById('rtitle').textContent=perfect?'コンプリート！':'おわり！';
  const rank = score>=60?'★★★ でんせつ級' : score>=40?'★★★ すごい！' :
               score>=25?'★★☆ いいね！' : score>=12?'★☆☆ その調子！' : '☆☆☆ もういちど！';
  document.getElementById('rank').textContent=rank;
  document.getElementById('brk').innerHTML =
    KINDS.map(k=>'<div>'+k.name+' <i>'+counts[k.key]+' / '+k.n+'</i></div>').join('')
    + '<div>つかまえた数 <i>'+found+' / '+TOTAL+'</i></div>';
  document.getElementById('rmsg').textContent = perfect
    ? '全部みつけました！のこり時間 '+fmt(Math.max(0,timeLeft))
    : 'きんいろチャッピーは10てん。すばやい子をねらうと点がのびます。';
  document.getElementById('result').style.display='flex';
  beep(perfect?1046:392,0.35,'triangle');
}
function doCatch(){
  netEl.classList.remove('swing'); void netEl.offsetWidth; netEl.classList.add('swing');
  setTimeout(()=>netEl.classList.remove('swing'),130);
  if(!hover||!gameActive){ beep(180,0.06,'sawtooth'); return; }
  const c=hover, kind=c.userData.kind;
  c.userData.caught=true;
  // 吸い込み演出
  let k=0;(function suck(){ k+=0.09; c.scale.multiplyScalar(0.85);
    c.position.lerp(camPos,0.17); if(k<1) requestAnimationFrame(suck); else c.visible=false; })();
  // 連続キャッチのコンボ
  const now=clock.elapsedTime;
  combo = (now-lastCatchAt<6) ? combo+1 : 1;
  lastCatchAt=now;
  const bonus = combo>=3?2:0;
  const pts = kind.pt+bonus;
  score+=pts; found++; counts[kind.key]++;
  foundEl.textContent=found; scoreEl.textContent=score;
  popEl.querySelector('.t').textContent=kind.name;
  popEl.querySelector('.p').textContent='+'+pts+(bonus?'（'+combo+'れんぞく！）':'');
  popEl.classList.toggle('gold',kind.key==='gold');
  popEl.classList.remove('hit'); void popEl.offsetWidth; popEl.classList.add('hit');
  beep(kind.key==='gold'?1318:(kind.key==='fast'?988:784),0.12,'triangle');
  hover=null;
  if(found>=TOTAL) setTimeout(endGame,800);
}
catchBtn.onclick=doCatch;

/* ══════════════════════════════════════════════════════════════
   起動
   ══════════════════════════════════════════════════════════════ */
async function enableSensor(){
  const D=window.DeviceOrientationEvent; if(!D) return false;
  if(typeof D.requestPermission==='function'){
    try{ if(await D.requestPermission()!=='granted') return false; }catch(_){ return false; }
  }
  addEventListener('deviceorientation',onOrient); return true;
}
async function startCameraBG(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return false;
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    vid.srcObject=st; await vid.play(); vid.style.display='block'; scene.background=null; return true;
  }catch(e){ fail('カメラERR '+(e.name||e)); return false; }
}
async function startXR(){
  const session=await navigator.xr.requestSession('immersive-ar',{
    requiredFeatures:['local-floor'], optionalFeatures:['dom-overlay'],
    domOverlay:{root:document.body}});
  renderer.xr.setReferenceSpaceType('local-floor');
  await renderer.xr.setSession(session);
  session.addEventListener('end',()=>{ gameActive=false; clearInterval(timerId); });
  scene.background=null; scene.fog=null;
  hideStart();
  renderer.setAnimationLoop(()=>{ tick(); });
}
function fallbackDesktop(){
  scene.background=new THREE.Color(0x9fd2ec);
  scene.fog=new THREE.FogExp2(0xbfe0f0,0.014);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.enablePan=false;
  controls.target.set(0,CFG.EYE_HEIGHT,-0.01);
  controls.minDistance=controls.maxDistance=0.001;
}
function setupDrag(){
  let d=null; const el=renderer.domElement;
  el.addEventListener('pointerdown',e=>d={x:e.clientX,y:e.clientY,yaw,pit});
  el.addEventListener('pointermove',e=>{ if(!d)return;
    yaw=d.yaw-(e.clientX-d.x)*0.005; pit=Math.max(-1.4,Math.min(1.4,d.pit-(e.clientY-d.y)*0.005)); });
  el.addEventListener('pointerup',()=>d=null);
}
function hideStart(){ const s=document.getElementById('start'); if(s) s.style.display='none'; }
function loopRAF(){ hideStart(); (function raf(){ if(MODE==='xr'&&renderer.xr.isPresenting)return;
  requestAnimationFrame(raf); tick(); })(); }

goBtn.onclick=async ()=>{
  goBtn.outerHTML='<div id="load">森とチャッピーを よういしています…</div>';
  FACE_TEX=makeFaceTexture();
  initThree(); buildForest(); placeChappies();
  if(MODE==='xr'){
    try{ await startXR(); }
    catch(e){ fail('XR起動失敗:'+(e.name||e)); MODE='desktop'; fallbackDesktop(); loopRAF(); }
  } else if(MODE==='ios'){
    const sOK=await enableSensor(), cOK=await startCameraBG();
    if(!cOK) fallbackDesktop(); else if(!sOK) setupDrag();
    loopRAF();
  } else { fallbackDesktop(); loopRAF(); }
  startGame();
};
document.getElementById('again').onclick=()=>{
  const R=spreadRadius(), spots=[];
  for(const c of cats){
    c.userData.caught=false; c.visible=true; c.scale.setScalar(c.userData.baseScale);
    c.userData.fleeing=0; c.userData.tired=0; c.userData.stamina=0;
    let p=null;
    for(let t=0;t<200;t++){
      const a=Math.random()*6.283, r=Math.max(2.5,Math.sqrt(Math.random())*R);
      const x=Math.cos(a)*r, z=Math.sin(a)*r;
      if(farEnough(x,z,spots,CFG.MIN_GAP)){ p={x,z}; break; }
    }
    if(!p){ const a=Math.random()*6.283, r=2.5+Math.random()*R; p={x:Math.cos(a)*r,z:Math.sin(a)*r}; }
    spots.push(p); c.position.set(p.x,0,p.z); pickTarget(c);
  }
  document.getElementById('result').style.display='none';
  startGame();
};

(async function boot(){
  await detectMode();
  const common='きんいろは10てん・すばやい子は5てん。6びょう以内に続けてつかまえると れんぞくボーナス。';
  if(MODE==='xr'){
    leadEl.textContent='まわりが森になり、チャッピーが'+TOTAL+'匹かくれています。歩いてさがし、近づいて「つかまえる」。'+common;
    noteEl.textContent='平らな床を映してからはじめてください。広く歩けるところでどうぞ。';
  } else if(MODE==='ios'){
    leadEl.textContent='カメラをとおすと森になり、チャッピーが'+TOTAL+'匹かくれています。かざして見まわし、近づいて「つかまえる」。'+common;
    noteEl.innerHTML='iPhoneは歩行追跡に非対応のため、その場で見まわすARです<br>設定→Safari→「モーションと画面の向きのアクセス」をオンに';
  } else {
    leadEl.textContent='森にチャッピーが'+TOTAL+'匹かくれています。ドラッグで見まわし、照準に入れて「つかまえる」。'+common;
    noteEl.textContent='スマホの実機（https://）で開くとARになります';
  }
  goBtn.style.display='';
})();
</script>
