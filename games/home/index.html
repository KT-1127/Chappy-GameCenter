// ---- puzzle generator (seeded) ----
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function randomSolution(N,r){
  const p=[];const used=new Array(N).fill(false);
  (function bt(row){if(row===N)return true;
    for(const c of shuffle([...Array(N).keys()],r)){
      if(used[c])continue;if(row>0&&Math.abs(p[row-1]-c)<=1)continue;
      used[c]=true;p[row]=c;if(bt(row+1))return true;used[c]=false}
    return false})(0);
  return p;
}
function growRegions(N,sol,r){
  const g=Array.from({length:N},()=>new Array(N).fill(-1));
  const frontier=[];
  for(let i=0;i<N;i++){g[i][sol[i]]=i}
  const weight=Array.from({length:N},()=>0.4+r()*1.6);
  let left=N*N-N;
  while(left>0){
    // pick a region weighted, then a random frontier cell of it
    const cand=[];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(g[y][x]!==-1)continue;
      for(const[dy,dx]of[[1,0],[-1,0],[0,1],[0,-1]]){const yy=y+dy,xx=x+dx;
        if(yy>=0&&yy<N&&xx>=0&&xx<N&&g[yy][xx]!==-1)cand.push([y,x,g[yy][xx]])}}
    let tot=0;for(const c of cand)tot+=weight[c[2]];
    let t=r()*tot,pick=cand[0];for(const c of cand){t-=weight[c[2]];if(t<=0){pick=c;break}}
    g[pick[0]][pick[1]]=pick[2];left--;
  }
  return g;
}
function countSolutions(N,g,limit){
  let cnt=0;const colU=new Array(N).fill(false),regU=new Array(N).fill(false);const p=[];
  (function bt(row){if(cnt>=limit)return;if(row===N){cnt++;return}
    for(let c=0;c<N;c++){if(colU[c]||regU[g[row][c]])continue;if(row>0&&Math.abs(p[row-1]-c)<=1)continue;
      colU[c]=regU[g[row][c]]=true;p[row]=c;bt(row+1);colU[c]=regU[g[row][c]]=false;if(cnt>=limit)return}})(0);
  return cnt;
}
function makePuzzle(N,seed){
  const r=mulberry(seed*7919+N*31);
  for(let tries=0;tries<4000;tries++){
    const sol=randomSolution(N,r);const g=growRegions(N,sol,r);
    if(countSolutions(N,g,2)===1)return{N,g,sol,tries};
  }
  return null;
}

// ---- チャッピー（chappy.js キットをそのまま使用）----
const MOOD={normal:'normal',happy:'happy',sad:'think',think:'think',sleep:'sleep'};
function headEl(mood){const w=document.createElement('div');w.className='ch';w.appendChild(Chappy.create({head:true,mood:MOOD[mood]||'normal',label:false}));return w}
Chappy.mount($('statIcon'),{head:true});
let guideSvg=Chappy.mount($('guide'),{follow:true,label:false});
let titleSvg=Chappy.mount($('titleChappy'),{follow:true});
let clearSvg=Chappy.mount($('clearChappy'),{mood:'happy'});
let overSvg=Chappy.mount($('overChappy'),{mood:'sleep'});
const MOVESEQ=['jump','wave','ears','nod'];let mvI=0;
$('titleChappy').onclick=()=>Chappy.play(titleSvg,MOVESEQ[mvI++%4]);
$('guide').onclick=()=>Chappy.play(guideSvg,MOVESEQ[mvI++%4]);
setTimeout(()=>Chappy.play(titleSvg,'wave'),600);
(function(){const m=$('mini');for(let y=0;y<5;y++)for(let x=0;x<5;x++){const d=document.createElement('div');
  if(y===2&&x===2){const h=document.createElement('div');h.className='mh';h.appendChild(Chappy.create({head:true,label:false}));d.appendChild(h)}
  else if(y===0&&x===0){d.className='ok';const h=document.createElement('div');h.className='mh';h.appendChild(Chappy.create({head:true,mood:'happy',label:false}));d.appendChild(h)}
  else if(Math.abs(y-2)<=1&&Math.abs(x-2)<=1){d.className='ng';d.textContent='×'}
  m.appendChild(d)}
  const cap=document.createElement('div');cap.className='minicap';cap.textContent='赤いマスはダメ ・ 左上のようにはなれていればOK';m.after(cap)})();

// ---- sound ----
let ac=null;
function tone(f,d=.12,type='triangle',v=.18,when=0,slide){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={x:()=>tone(520,.05,'sine',.08),place:(n)=>{tone(600+n*60,.1);tone(900+n*60,.14,'sine',.12,.06)},bad:()=>{tone(220,.25,'sawtooth',.12,0,110)},
  clear:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.16,i*.11)),hint:()=>tone(880,.2,'sine',.12,0,1320)};

// ---- state ----
let level=store.get('level',1),maxLevel=store.get('max',1),P,N,state,hearts,hints,history,startT,timerOn,done;
function sizeFor(l){return l<=3?5:l<=8?6:l<=15?7:l<=25?8:9}
function setPick(){$('lvPick').textContent='レベル '+level}
setPick();
$('lvDown').onclick=()=>{level=Math.max(1,level-1);setPick()};
$('lvUp').onclick=()=>{level=Math.min(maxLevel,level+1);setPick()};

function say(html,face='normal',move){ $('bubble').innerHTML=html;
  const m=MOOD[face]||'normal'; if(guideSvg._opts.mood!==m)guideSvg=Chappy.setMood(guideSvg,m);
  Chappy.play(guideSvg,move||(face==='happy'?'jump':face==='sad'?'ears':'nod')); }

function startLevel(){
  N=sizeFor(level);P=makePuzzle(N,level);
  state=Array.from({length:N},()=>new Array(N).fill(0)); // 0 empty,1 x,2 chappy
  hearts=3;hints=3;history=[];done=false;startT=Date.now();
  $('lvLabel').textContent='レベル '+level+' ・ '+N+'×'+N;
  buildBoard();render();
  say(level===1?'まずは<em>1マスだけの色</em>や、せまいおうちをさがしてみよう！':'この'+N+'×'+N+'、ぼく'+N+'ひきのおうちを見つけてね！');
}
function buildBoard(){
  const b=$('board');b.innerHTML='';b.style.gridTemplateColumns=`repeat(${N},1fr)`;b.style.gridTemplateRows=`repeat(${N},1fr)`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const c=document.createElement('div');c.className='cell';c.dataset.y=y;c.dataset.x=x;c.setAttribute('role','gridcell');
    const g=P.g[y][x];c.style.background=`var(${COLORS[g]})`;
    if(y===0||P.g[y-1][x]!==g)c.classList.add('bt');if(y===N-1||P.g[y+1][x]!==g)c.classList.add('bb');
    if(x===0||P.g[y][x-1]!==g)c.classList.add('bl');if(x===N-1||P.g[y][x+1]!==g)c.classList.add('br');
    b.appendChild(c);
  }
  fitBoard();
}
function fitBoard(){const w=$('boardWrap'),s=Math.min(w.clientWidth,w.clientHeight);$('board').style.width=s+'px';$('board').style.height=s+'px'}
addEventListener('resize',()=>N&&fitBoard());

function count(){let n=0;for(const r of state)for(const v of r)if(v===2)n++;return n}
function render(){
  const cells=$('board').children;
  const placed=new Set();for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(state[y][x]===2)placed.add(P.g[y][x]);
  for(const c of cells){const y=+c.dataset.y,x=+c.dataset.x,v=state[y][x];
    const want=v===2?'ch':v===1?'x':'';
    if(c.dataset.v!==want){c.dataset.v=want;c.innerHTML=v===1?'<span class="x"></span>':'';if(v===2)c.appendChild(headEl('normal'));}
    c.classList.toggle('done',placed.has(P.g[y][x])&&v!==2);
    c.setAttribute('aria-label',`${y+1}行${x+1}列 ${v===2?'チャッピー':v===1?'×':'空き'}`);
  }
  $('hearts').innerHTML=[0,1,2].map(i=>`<span class="${i<hearts?'':'off'}">❤️</span>`).join('');
  $('count').textContent=count()+'/'+N;$('hintN').textContent=hints;$('btnHint').disabled=hints<=0||done||!!tut;$('btnUndo').disabled=$('btnReset').disabled=!!tut;
}
function cellEl(y,x){return $('board').children[y*N+x]}

// ---- input: tap cycles; drag paints ×
let drag=null;
$('board').addEventListener('pointerdown',e=>{const c=e.target.closest('.cell');if(!c||done)return;
  const y=+c.dataset.y,x=+c.dataset.x;drag={y,x,moved:false,mode:state[y][x]===0?1:null,painted:[]};
  try{$('board').setPointerCapture(e.pointerId)}catch(_){}
});
$('board').addEventListener('pointermove',e=>{if(!drag||drag.mode==null||tut)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest('.cell');if(!c)return;
  const y=+c.dataset.y,x=+c.dataset.x;if(y===drag.y&&x===drag.x&&!drag.moved)return;
  if(!drag.moved){drag.moved=true;paintX(drag.y,drag.x)}paintX(y,x);
});
function paintX(y,x){if(state[y][x]!==0)return;state[y][x]=1;drag.painted.push([y,x]);sfx.x();render()}
addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;
  if(d.moved){if(d.painted.length)history.push({type:'paint',cells:d.painted});return}
  tap(d.y,d.x)});
addEventListener('pointercancel',()=>drag=null);

function tap(y,x){
  if(tut)return tutTap(y,x);
  clearHint();
  const v=state[y][x];
  if(v===0){state[y][x]=1;history.push({type:'set',y,x,prev:0});sfx.x();render();return}
  if(v===1){place(y,x);return}
  // v===2 (correct, locked)
  say('このチャッピーはもう正しいおうちにいるよ！','happy');
}
function place(y,x){
  if(P.sol[y]===x){
    state[y][x]=2;const auto=[];
    for(let yy=0;yy<N;yy++)for(let xx=0;xx<N;xx++){if(state[yy][xx]!==0)continue;
      if(yy===y||xx===x||P.g[yy][xx]===P.g[y][x]||(Math.abs(yy-y)<=1&&Math.abs(xx-x)<=1)){state[yy][xx]=1;auto.push([yy,xx])}}
    history.push({type:'place',y,x,auto});
    const n=count();sfx.place(n);render();
    if(tut)return;
    if(n===N)return win();
    const lines=['いいね！ここがぼくのおうち！','ぴったり！まわりは自動で×にしたよ','その調子！あと'+(N-n)+'ひき！','すごい！のこり'+(N-n)+'ひき'];
    say(lines[Math.floor(Math.random()*lines.length)],'happy');
  }else{
    hearts--;sfx.bad();render();const c=cellEl(y,x);
    c.replaceChildren(headEl('sad'));c.dataset.v='sad';c.classList.add('wrong');
    say(hearts>0?'うわっ、ここは<em>ちがうおうち</em>だった…！あと'+hearts+'回まちがえられるよ':'もうハートがない…','sad');
    setTimeout(()=>{c.classList.remove('wrong');state[y][x]=1;render();if(hearts<=0)lose()},650);
  }
}
// ---- undo / reset ----
$('btnUndo').onclick=()=>{if(done||tut)return;const h=history.pop();if(!h){say('もどせる手はないよ');return}
  if(h.type==='set')state[h.y][h.x]=h.prev;
  else if(h.type==='paint')h.cells.forEach(([y,x])=>state[y][x]=0);
  else if(h.type==='place'){state[h.y][h.x]=1;h.auto.forEach(([y,x])=>state[y][x]=0)}
  clearHint();render()};
$('btnReset').onclick=()=>{if(done||tut)return;for(const r of state)r.fill(0);history=[];clearHint();render();say('まっさらにしたよ。ハートはそのままね')};

// ---- hint: find a logically forced spot ----
let hintCell=null;
function clearHint(){if(hintCell){hintCell.classList.remove('hint');hintCell=null}}
function forcedHint(){
  // a region / row / col whose only non-× cells are one cell
  const groups=[];
  for(let i=0;i<N;i++){groups.push({name:'この色のおうち',cells:[]},{name:(i+1)+'行目',cells:[]},{name:(i+1)+'列目',cells:[]})}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(state[y][x]===1)continue;groups[P.g[y][x]*3].cells.push([y,x]);groups[y*3+1].cells.push([y,x]);groups[x*3+2].cells.push([y,x])}
  for(const g of groups){if(g.cells.length===1){const[y,x]=g.cells[0];if(state[y][x]===0)return{y,x,why:g.name+'で、のこっているのはここだけ！'}}}
  return null;
}
$('btnHint').onclick=()=>{if(done||hints<=0)return;clearHint();
  let h=forcedHint();hints--;sfx.hint();
  if(!h){const unsolved=[];for(let y=0;y<N;y++)if(state[y][P.sol[y]]!==2)unsolved.push(y);
    const y=unsolved[Math.floor(Math.random()*unsolved.length)];h={y,x:P.sol[y],why:'ここにぼくがいる気がする…！'}}
  hintCell=cellEl(h.y,h.x);hintCell.classList.add('hint');
  say('<em>ヒント</em>：'+h.why+'（光ってるマス）','normal','nod');render()};

// ---- tutorial ----
const TUTP={N:5,g:[[2,0,1,1,1],[2,2,2,1,3],[2,2,2,3,3],[4,4,2,3,3],[4,4,4,4,3]],sol:[1,3,0,4,2]};
const TUT=[
 {t:'ぼくチャッピー！このマップには<em>5つの色のおうち</em>があるよ。ぼくたち5ひきを、正しいおうちに入れてね',next:1},
 {t:'ルールは3つ。①同じ色のおうちに1ぴきずつ。②たての列・よこの列にも1ぴきずつ。③ぼくたちは<em>くっつくのがニガテ</em>',next:1},
 {t:'緑のおうちを見て。<em>1マスしかない</em>から、ここに住むしかないね。光ってるマスを<em>1回</em>タップしてみて',tg:[0,1],ex:'x'},
 {t:'×がついたね。×は「ここじゃない」のメモだよ。同じマスを<em>もう1回</em>タップすると、ぼくが入るよ',tg:[0,1],ex:'place'},
 {t:'入れた！まわりに×が自動でついたよ。同じよこの列、同じたての列、同じ色。それと<em>くっついている8マス</em>（赤いわく）。ななめにくっつくのもダメなんだ',ring:[0,1],next:1},
 {t:'こんどは<em>むらさきのおうち</em>。×がついていないマスは1つだけ！そこに2回タップしてね',tg:[1,3],ex:'place'},
 {t:'上から3段目の<em>よこの列</em>を見て。のこっているのは1マスだけだね',tg:[2,0],ex:'place'},
 {t:'左から3列目の<em>たての列</em>。のこりは1マス！',tg:[4,2],ex:'place'},
 {t:'さいごは<em>オレンジのおうち</em>。のこったマスはどこかな？',tg:[3,4],ex:'place'},
 {t:'できた！緑のわくの2ひきは、ななめの線にならんでいるけど<em>はなれているからOK</em>。ダメなのはくっつくときだけだよ',pair:[[2,0],[4,2]],next:1,face:'happy'},
 {t:'まちがえると❤️がへるよ。こまったら<em>りんごのヒント</em>を使ってね。じゃあ本番いってみよう！',next:1,end:1,face:'happy'}
];
let tut=null;
function startTutorial(){tut={i:0};N=5;P=TUTP;state=Array.from({length:N},()=>new Array(N).fill(0));hearts=3;hints=0;history=[];done=false;
  $('lvLabel').innerHTML='あそびかた<span class="tutTag">チュートリアル</span>';buildBoard();render();tutShow()}
function tutClear(){for(const c of $('board').children)c.classList.remove('hint','ring','okpair')}
function tutShow(extra){const s=TUT[tut.i];tutClear();
  if(s.tg)cellEl(...s.tg).classList.add('hint');
  if(s.ring){const[y0,x0]=s.ring;for(let y=y0-1;y<=y0+1;y++)for(let x=x0-1;x<=x0+1;x++)if(y>=0&&x>=0&&y<N&&x<N&&!(y===y0&&x===x0))cellEl(y,x).classList.add('ring')}
  if(s.pair)s.pair.forEach(([y,x])=>cellEl(y,x).classList.add('okpair'));
  say(s.t+(extra?'<small>'+extra+'</small>':'')+(s.next?`<br><button class="nextb" id="tutNext">${s.end?'本番スタート ▶':'つぎへ ▶'}</button>`:''),s.face||'normal');
  if(s.pair)for(const c of $('board').children)if(state[c.dataset.y][c.dataset.x]===2){c.replaceChildren(headEl('happy'));c.dataset.v='happy'}
}
$('bubble').addEventListener('click',e=>{if(!tut||e.target.id!=='tutNext')return;tone(660,.06);
  if(TUT[tut.i].end){tut=null;store.set('tutDone',true);startLevel();return}
  tut.i++;tutShow()});
function tutTap(y,x){const s=TUT[tut.i];
  if(!s.tg){tutShow('「つぎへ」をおしてね');return}
  if(y!==s.tg[0]||x!==s.tg[1]){tutShow('光っているマスをタップしてね');return}
  if(s.ex==='x'){state[y][x]=1;sfx.x();render();tut.i++;tutShow();return}
  if(state[y][x]===0){state[y][x]=1;sfx.x();render();tutShow('×になったね。もう1回タップ！');return}
  place(y,x);tut.i++;setTimeout(()=>tut&&tutShow(),350);
}

// ---- end states ----
function fmt(ms){const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function win(){done=true;sfx.clear();clearHint();
  for(const c of $('board').children)if(state[c.dataset.y][c.dataset.x]===2){c.replaceChildren(headEl('happy'));c.dataset.v='happy';c.classList.add('party')}
  say('みんなおうちに帰れたよ！ありがとう！','happy');
  const t=Date.now()-startT,bests=store.get('best',{}),prev=bests[level];const isNew=!prev||t<prev;if(isNew){bests[level]=t;store.set('best',bests)}
  window.CGCBridge&&CGCBridge.report({board:'lv'+level,boardName:'レベル '+level+'（'+N+'×'+N+'）',score:t});
  maxLevel=Math.max(maxLevel,level+1);store.set('max',maxLevel);store.set('level',level+1);
  $('clearRes').innerHTML=`レベル ${level} クリア ・ タイム ${fmt(t)}<br>${isNew?'<span class="new">ベスト記録！</span>':'ベスト '+fmt(prev)} ・ のこりハート ${'❤️'.repeat(hearts)}`;
  for(let i=0;i<18;i++){const a=document.createElement('img');a.src=IMG.apple;a.className='fall';a.style.left=Math.random()*100+'vw';a.style.animationDuration=(1.6+Math.random()*1.6)+'s';a.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(a);setTimeout(()=>a.remove(),4000)}
  setTimeout(()=>{$('clear').hidden=false;Chappy.play(clearSvg,'jump');setTimeout(()=>Chappy.play(clearSvg,'wave'),950)},1300);
}
function lose(){done=true;$('over').hidden=false;setTimeout(()=>Chappy.play(overSvg,'nod'),300)}
$('btnStart').onclick=()=>{tone(660,.08);$('title').hidden=true;store.get('tutDone',false)?startLevel():startTutorial()};
$('btnTut').onclick=()=>{tone(660,.08);$('title').hidden=true;startTutorial()};
$('btnNext').onclick=()=>{$('clear').hidden=true;level++;startLevel()};
$('btnMenu').onclick=()=>{$('clear').hidden=true;level=Math.min(maxLevel,level+1);setPick();$('title').hidden=false;setTimeout(()=>Chappy.play(titleSvg,'wave'),300)};
$('btnRetry').onclick=()=>{$('over').hidden=true;startLevel()};
</script>

</body></html>
