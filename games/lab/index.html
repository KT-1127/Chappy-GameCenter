<style>
 :root{ --ink:#1E2A38; --sub:#5B6B7E; --blue:#2F6FB0; --blue-deep:#24527F;
        --teal:#0FB5AA; --face:#14181F; --eye:#35D0C5; }
 *{ box-sizing:border-box; }
 body{ margin:0; min-height:100vh; display:grid; place-items:center;
   background:linear-gradient(160deg,#EDF2F7,#DDE7F2); color:var(--ink);
   font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif; }
 .box{ text-align:center; padding:24px; }
 .robot{ width:110px; height:92px; border-radius:18px; background:var(--face);
   margin:0 auto 6px; position:relative; }
 .robot::before,.robot::after{ content:""; position:absolute; top:30px;
   width:18px; height:18px; border-radius:50%; background:var(--eye);
   box-shadow:0 0 10px var(--eye); animation:blink 3.4s infinite; }
 .robot::before{ left:26px; } .robot::after{ right:26px; }
 .robot i{ position:absolute; left:50%; bottom:22px; width:38px; height:7px;
   margin-left:-19px; border-radius:4px; background:var(--eye); }
 @keyframes blink{ 0%,93%,100%{transform:scaleY(1)} 96%{transform:scaleY(.1)} }
 h1{ font-size:24px; margin:14px 0 4px; }
 p{ color:var(--sub); margin:0 0 26px; font-size:14px; font-weight:700; }
 .btns{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
 a{ display:flex; flex-direction:column; gap:4px; width:220px; padding:20px;
   background:#fff; color:var(--ink); text-decoration:none; border-radius:18px;
   box-shadow:0 3px 14px rgba(30,42,56,.10); transition:transform .12s; }
 a:hover{ transform:translateY(-3px); }
 a .big{ font-size:17px; font-weight:800; }
 a .small{ font-size:12.5px; color:var(--sub); font-weight:700; }
 a.make .big{ color:var(--blue); }
 a.watch .big{ color:var(--teal); }
 a.learn .big{ color:#E8871E; }
 a.solve .big{ color:#7A4FBF; }
 .badge{ display:inline-block; font-size:11px; font-weight:800; padding:2px 8px;
   border-radius:999px; background:#E2F6F4; color:#0A8F86; margin-top:4px; }
 @media (prefers-reduced-motion:reduce){ .robot::before,.robot::after{animation:none} }
