<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>バナー画像メーカー</title>
<!--
  top2.png と同じ大きさ（1882×836）のバナーを描くページ。
  ?g=link / ringo / paku / rhythm / home を付けて開き、ヘッドレス Chrome でスクリーンショットして games/<id>/top2.png にする。
  （README の「バナー画像を作り直す」参照）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
<script src="../assets/chappy.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1882px;height:836px;overflow:hidden}
#stage{position:relative;width:1882px;height:836px;overflow:hidden;font-family:"M PLUS Rounded 1c",sans-serif}
.abs{position:absolute}
/* タイトル：白いふち + こい色のふち + かげ（top2.png のロゴに近づける） */
.logo{position:absolute;left:110px;top:120px;font-family:"Mochiy Pop One",sans-serif;line-height:1.02;transform:rotate(-4deg);transform-origin:left center}
.logo .l{display:block;position:relative;white-space:nowrap}
.logo .l span{position:relative;display:inline-block}
.logo .l span::before{content:attr(data-t);position:absolute;inset:0;-webkit-text-stroke:52px #fff;color:#fff;z-index:-2;filter:drop-shadow(0 14px 0 var(--oc,#1d2a4a)) drop-shadow(0 20px 18px rgba(0,0,0,.3))}
.logo .l span::after{content:attr(data-t);position:absolute;inset:0;-webkit-text-stroke:22px var(--oc,#1d2a4a);color:var(--oc,#1d2a4a);z-index:-1}
.plate{position:absolute;font:900 38px "M PLUS Rounded 1c";color:#5a3a14;background:linear-gradient(#f9dfae,#e8b871);padding:14px 34px;border-radius:22px;box-shadow:0 8px 0 #b27a3a,0 18px 30px rgba(0,0,0,.25);border:5px solid #fff3d6;white-space:nowrap}
.chappy{position:absolute}
.chappy svg{filter:drop-shadow(0 26px 30px rgba(0,0,0,.28))}
.spark{position:absolute;color:#fff;font-size:70px;text-shadow:0 0 30px #fff8b0;animation:none}
.ray{position:absolute;width:26px;height:90px;background:#ffd84a;border-radius:14px;box-shadow:0 6px 0 #e08a1a}
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
const S = document.getElementById("stage");
const g = new URLSearchParams(location.search).get("g") || "link";
const add = (html) => { S.insertAdjacentHTML("beforeend", html); return S.lastElementChild; };
// 白いふち付きのタイトル（1行ごとに [文字, 色, 大きさ]）
function logo(lines, x, y, outline) {
  const el = add(`<div class="logo" style="left:${x}px;top:${y}px;--oc:${outline}"></div>`);
  el.innerHTML = lines.map(([t, c, s]) => `<span class="l" style="font-size:${s}px">${[...t].map(ch => `<span data-t="${ch}" style="color:${c}">${ch}</span>`).join("")}</span>`).join("");
  return el;
}
function plate(text, x, y) { return add(`<div class="plate" style="left:${x}px;top:${y}px">${text}</div>`); }
function chappy(x, y, w, opt = {}) {
  const box = add(`<div class="chappy" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${opt.rot || 0}deg) scaleX(${opt.flip ? -1 : 1})"></div>`);
  const svg = Chappy.mount(box, { mood: opt.mood || "happy", head: !!opt.head, label: false });
  // アニメーションを止めて、動きのいちばん良い形で描く
  svg.querySelectorAll("*").forEach(n => n.style.animation = "none");
  if (opt.wave) { const a = svg.querySelector(".cp-armR"); if (a) a.style.transform = "rotate(-112deg)"; const p = svg.querySelector(".cp-patch"); if (p) p.style.opacity = 1; }
  return box;
}
function sparkles(list) { list.forEach(([x, y, s]) => add(`<div class="spark" style="left:${x}px;top:${y}px;font-size:${s}px">✦</div>`)); }
function rays(x, y, list) { list.forEach(([dx, dy, r, h]) => add(`<div class="ray" style="left:${x + dx}px;top:${y + dy}px;height:${h || 90}px;transform:rotate(${r}deg)"></div>`)); }
function apple(x, y, s, rot = 0) {
  return add(`<svg class="abs" style="left:${x}px;top:${y}px;width:${s}px;transform:rotate(${rot}deg);filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))" viewBox="0 0 100 100">
    <defs><radialGradient id="ap${x}${y}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff8a80"/><stop offset=".45" stop-color="#e8262a"/><stop offset="1" stop-color="#9c0f14"/></radialGradient></defs>
    <path d="M50 28 C30 14 6 26 8 52 C10 80 32 96 50 88 C68 96 90 80 92 52 C94 26 70 14 50 28Z" fill="url(#ap${x}${y})"/>
    <path d="M50 30 Q52 14 58 6" stroke="#6b3b1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M56 16 Q74 2 86 14 Q72 26 56 16Z" fill="#3cc47c"/>
    <ellipse cx="30" cy="42" rx="9" ry="14" fill="#fff" opacity=".45" transform="rotate(-20 30 42)"/></svg>`);
}
function clouds(list) { list.forEach(([x, y, w]) => add(`<svg class="abs" style="left:${x}px;top:${y}px;width:${w}px" viewBox="0 0 200 90"><g fill="#fff"><ellipse cx="60" cy="60" rx="55" ry="30"/><ellipse cx="105" cy="42" rx="48" ry="40"/><ellipse cx="150" cy="62" rx="45" ry="26"/></g></svg>`)); }
function bokeh(n, colors) {
  for (let i = 0; i < n; i++) { const s = 20 + Math.random() * 90;
    add(`<div class="abs" style="left:${Math.random() * 1882}px;top:${Math.random() * 836}px;width:${s}px;height:${s}px;border-radius:50%;background:${colors[i % colors.length]};opacity:${.15 + Math.random() * .3};filter:blur(${Math.random() * 6}px)"></div>`); }
}
// チャッピーリンクのブロック（元のゲームと同じ顔）
const face = a => `<path d="M15 40 L23 7 L47 32 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round"/><path d="M85 40 L77 7 L53 32 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 34 L27 17 L40 31 Z" fill="${a}" opacity=".8"/><path d="M76 34 L73 17 L60 31 Z" fill="${a}" opacity=".8"/><rect x="11" y="26" width="78" height="62" rx="27" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/><rect x="19" y="33" width="62" height="45" rx="19" fill="#0f172a"/><ellipse cx="38" cy="53" rx="6" ry="8" fill="#2dd4ec"/><ellipse cx="62" cy="53" rx="6" ry="8" fill="#2dd4ec"/><path d="M42 64 Q46.5 70 50 64 Q53.5 70 58 64" stroke="#2dd4ec" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;

const SCENES = {
  link() {
    S.style.background = "radial-gradient(circle at 30% 30%,#fff3fa 0,#ffd0e6 30%,#ff9cc8 62%,#b98bff 100%)";
    bokeh(40, ["#fff", "#ffe08a", "#9fe6ff"]);
    // ななめに置いたブロックの盤
    const C = [["#f87171", "#dc2626", "#ef4444"], ["#60a5fa", "#2563eb", "#3b82f6"], ["#34d399", "#059669", "#10b981"], ["#fcd34d", "#f59e0b", "#f59e0b"]];
    const map = [[0,1,2,3,1,0],[2,0,0,1,3,2],[3,2,0,0,1,1],[1,3,2,0,2,3],[0,1,3,2,0,1],[2,0,1,3,1,0]];
    const B = add(`<div class="abs" style="left:1060px;top:40px;width:760px;height:760px;transform:perspective(1600px) rotateY(-16deg) rotateZ(6deg);background:rgba(255,255,255,.55);border-radius:60px;padding:22px;display:grid;grid-template:repeat(6,1fr)/repeat(6,1fr);gap:12px;box-shadow:0 30px 60px rgba(120,0,80,.3),inset 0 0 0 8px rgba(255,255,255,.7)"></div>`);
    B.innerHTML = map.flat().map((k, i) => { const c = C[k], hit = [1,8,9,15,16].includes(i) || [21,22].includes(i) && false;
      return `<div style="border-radius:26px;background:linear-gradient(135deg,${c[0]},${c[1]});box-shadow:inset 0 -10px 0 rgba(0,0,0,.18)${[1, 8, 9, 15, 16].includes(i) ? ",0 0 0 8px #fff,0 0 40px #fff" : ""};display:grid;place-items:center;transform:scale(${[1, 8, 9, 15, 16].includes(i) ? .9 : 1})"><svg viewBox="0 0 100 100" style="width:86%">${face(c[2])}</svg></div>`; }).join("");
    // なぞった線
    add(`<svg class="abs" style="left:1060px;top:40px;width:760px;height:760px;transform:perspective(1600px) rotateY(-16deg) rotateZ(6deg)" viewBox="0 0 760 760"><polyline points="${[[1,0],[2,1],[3,1],[3,2],[4,2]].map(([c, r]) => `${22 + c * 120 + 54},${22 + r * 120 + 54}`).join(" ")}" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".95" style="filter:drop-shadow(0 0 14px #fff)"/></svg>`);
    add(`<div class="abs" style="left:1500px;top:160px;font:400 92px 'Mochiy Pop One';color:#fff;-webkit-text-stroke:10px #e2548f;paint-order:stroke fill;transform:rotate(8deg)">+500!</div>`);
    logo([["チャッピー", "#ffffff", 150], ["リンク", "#ff4f9a", 190]], 175, 70, "#5a1b4a");
    rays(80, 60, [[0, 0, -30], [70, -30, -10], [-40, 70, -55, 70]]);
    plate("おなじ色を なぞって 消そう！", 130, 540);
    chappy(760, 430, 300, { wave: true });
    sparkles([[960, 120, 80], [1000, 360, 50], [120, 690, 60], [880, 640, 46]]);
  },
  ringo() {
    S.style.background = "linear-gradient(#3fb6ff 0,#8fdcff 48%,#c9f1ff 62%)";
    clouds([[60, 40, 360], [760, 20, 300], [1420, 70, 380], [1180, 230, 220]]);
    add(`<svg class="abs" style="left:0;top:430px;width:1882px;height:406px" viewBox="0 0 1882 406" preserveAspectRatio="none">
      <path d="M0 120 Q300 20 620 100 T1250 80 T1882 110 V406 H0Z" fill="#7fd66b"/><path d="M0 170 Q420 90 900 160 T1882 140 V406 H0Z" fill="#5fc457"/>
      <path d="M-40 406 C400 250 1300 260 1922 330 L1922 406Z" fill="#8a8f9c"/><path d="M-40 406 C400 270 1300 280 1922 350" stroke="#fff" stroke-width="12" stroke-dasharray="70 50" fill="none"/></svg>`);
    // りんごの木
    [[1460, 300], [1690, 340]].forEach(([x, y]) => { add(`<svg class="abs" style="left:${x}px;top:${y}px;width:220px" viewBox="0 0 200 240"><rect x="88" y="130" width="26" height="100" rx="10" fill="#8a5a2b"/><circle cx="100" cy="90" r="88" fill="#3cae55"/><circle cx="60" cy="70" r="50" fill="#4cc466"/>${[[60, 60], [120, 50], [140, 110], [80, 120], [100, 80]].map(([a, b]) => `<circle cx="${a}" cy="${b}" r="13" fill="#e8262a"/>`).join("")}</svg>`); });
    // トラック
    const truck = (x, y, s, col) => add(`<svg class="abs" style="left:${x}px;top:${y}px;width:${s}px;filter:drop-shadow(0 18px 14px rgba(0,0,0,.3))" viewBox="0 0 300 180">
      <rect x="10" y="40" width="180" height="96" rx="14" fill="${col}"/><rect x="18" y="48" width="164" height="16" rx="8" fill="#fff" opacity=".35"/>
      <path d="M190 70 h56 l40 40 v26 h-96z" fill="#fff"/><path d="M200 80 h40 l26 28 h-66z" fill="#9fe6ff"/>
      <circle cx="70" cy="146" r="28" fill="#30425a"/><circle cx="70" cy="146" r="11" fill="#cfd8e3"/><circle cx="236" cy="146" r="28" fill="#30425a"/><circle cx="236" cy="146" r="11" fill="#cfd8e3"/></svg>`);
    truck(1000, 520, 420, "#ef4b4b");
    [[1030, 470], [1090, 455], [1150, 470], [1060, 420], [1120, 418]].forEach(([x, y]) => apple(x, y, 70));
    truck(1430, 600, 300, "#ffb020");
    [[1450, 560, 54], [1500, 548, 54], [1550, 560, 54]].forEach(([x, y, s]) => apple(x, y, s));
    logo([["チャッピーの", "#ffffff", 120], ["りんご便", "#ff4b4b", 200]], 175, 70, "#5a1414");
    rays(70, 70, [[0, 0, -30], [70, -30, -10]]);
    plate("トラックで りんごを とどけよう！", 130, 540);
    chappy(790, 350, 300, { wave: true });
    apple(1110, 60, 150, -12);
    sparkles([[1260, 60, 70], [1040, 200, 46], [880, 260, 40]]);
  },
  paku() {
    S.style.background = "radial-gradient(circle at 70% 40%,#fffbe0 0,#d8f7a8 40%,#7fd66b 75%,#3cae55 100%)";
    bokeh(30, ["#fff", "#ffe08a"]);
    // お皿と食べもの
    add(`<div class="abs" style="left:980px;top:110px;width:820px;height:640px;border-radius:50%;background:radial-gradient(#ffffff 55%,#e8f1f6 56%,#ffffff 70%,#d9e4ec 100%);box-shadow:0 40px 60px rgba(0,60,20,.3)"></div>`);
    const dots = ["#ef4444", "#f59e0b", "#3b82f6", "#10b981", "#ec4899", "#8b5cf6"];
    for (let r = 0; r < 7; r++) for (let c = 0; c < 11; c++) {
      const x = 1120 + c * 52 + (r % 2) * 26, y = 210 + r * 56, dx = x - 1390, dy = (y - 380) * 1.3;
      if (dx * dx + dy * dy > 270 * 270 || (x > 1430 && y > 300 && y < 470)) continue;
      add(`<div class="abs" style="left:${x}px;top:${y}px;width:42px;height:42px;border-radius:12px;background:${dots[(r * 3 + c) % 6]};box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)"></div>`);
    }
    // 食べているチャッピー（顔）
    chappy(1380, 250, 300, { head: true, mood: "happy", rot: -8 });
    add(`<div class="abs" style="left:1540px;top:420px;width:120px;height:70px;border-radius:0 0 70px 70px;background:#5b1b22;border:8px solid #fff;transform:rotate(-8deg)"></div>`);
    ["#ef4444", "#f59e0b", "#3b82f6"].forEach((c, i) => add(`<div class="abs" style="left:${1680 + i * 50}px;top:${470 - i * 40}px;width:40px;height:40px;border-radius:10px;background:${c};transform:rotate(${i * 25}deg)"></div>`));
    add(`<div class="abs" style="left:1450px;top:110px;font:400 96px 'Mochiy Pop One';color:#fff;-webkit-text-stroke:10px #23935a;paint-order:stroke fill;white-space:nowrap;transform:rotate(10deg)">パクッ！</div>`);
    logo([["パクパク", "#ffd84a", 190], ["チャッピー", "#ffffff", 150]], 175, 70, "#0f4a2a");
    rays(70, 60, [[0, 0, -30], [70, -30, -10], [-40, 70, -55, 70]]);
    plate("ぜんぶ 食べきって ごちそうさま！", 130, 540);
    chappy(790, 400, 300, { wave: true });
    sparkles([[930, 90, 70], [960, 330, 46], [110, 700, 56]]);
  },
  rhythm() {
    S.style.background = "radial-gradient(ellipse at 70% 110%,#ff5ad1 0,#7b3cff 35%,#2a1260 70%,#120838 100%)";
    for (let i = 0; i < 90; i++) add(`<div class="abs" style="left:${Math.random() * 1882}px;top:${Math.random() * 500}px;width:${2 + Math.random() * 4}px;height:${2 + Math.random() * 4}px;border-radius:50%;background:#fff;opacity:${.4 + Math.random() * .6}"></div>`);
    // 4つのレーン
    add(`<svg class="abs" style="left:880px;top:0;width:1002px;height:836px" viewBox="0 0 1002 836">
      <defs><linearGradient id="ln" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd3f0" stop-opacity="0"/><stop offset="1" stop-color="#4fd3f0" stop-opacity=".55"/></linearGradient></defs>
      <path d="M420 0 L580 0 L1000 836 L0 836Z" fill="rgba(10,0,40,.55)"/>
      ${[0, 1, 2, 3, 4].map(i => `<line x1="${420 + i * 40}" y1="0" x2="${i * 250}" y2="836" stroke="url(#ln)" stroke-width="6"/>`).join("")}
      <path d="M118 600 L882 600" stroke="#fff" stroke-width="14" stroke-linecap="round" style="filter:drop-shadow(0 0 16px #4fd3f0)"/>
      ${[[0, 560, "#ff5a8a"], [1, 330, "#ffd84a"], [2, 470, "#4fd3f0"], [3, 220, "#5fd38d"], [1, 600, "#ffd84a"], [3, 600, "#5fd38d"]].map(([l, y, c]) => {
        const t = y / 836, x0 = 420 + l * 40, x1 = l * 250, lx = x0 + (x1 - x0) * t, w = (40 + 210 * t) * .9, h = 14 + 40 * t;
        return `<rect x="${lx + (250 * t + 40 * (1 - t)) * .05}" y="${y - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${c}" style="filter:drop-shadow(0 0 ${10 + 20 * t}px ${c})"/>`; }).join("")}</svg>`);
    // 音符
    [[860, 120, 110, "#ffd84a", -14], [1700, 90, 90, "#4fd3f0", 12], [1550, 330, 70, "#ff5a8a", -8], [990, 400, 60, "#5fd38d", 10]].forEach(([x, y, s, c, r]) =>
      add(`<svg class="abs" style="left:${x}px;top:${y}px;width:${s}px;transform:rotate(${r}deg);filter:drop-shadow(0 0 18px ${c})" viewBox="0 0 64 64"><path d="M24 46V12l30-6v34" fill="none" stroke="${c}" stroke-width="6" stroke-linejoin="round"/><ellipse cx="17" cy="47" rx="9" ry="7" fill="${c}"/><ellipse cx="47" cy="41" rx="9" ry="7" fill="${c}"/></svg>`));
    logo([["チャッピー", "#ffffff", 150], ["リズム", "#ffd84a", 200]], 175, 70, "#2a0f5e");
    rays(70, 60, [[0, 0, -30], [70, -30, -10], [-40, 70, -55, 70]]);
    plate("音にあわせて タップ！", 130, 540);
    chappy(640, 360, 330, { wave: true });
    add(`<div class="abs" style="left:1290px;top:650px;font:400 110px 'Mochiy Pop One';color:#fff;-webkit-text-stroke:12px #ff3fa4;paint-order:stroke fill;letter-spacing:.04em;transform:rotate(-6deg);filter:drop-shadow(0 0 30px #ff5ad1)">FEVER!</div>`);
  },
  home() {
    S.style.background = "linear-gradient(#ffb36b 0,#ffd9a0 45%,#fff1d6 64%)";
    clouds([[80, 50, 300], [1250, 40, 340], [900, 140, 200]]);
    add(`<div class="abs" style="left:0;top:600px;width:1882px;height:236px;background:#8fd46b;border-radius:50% 50% 0 0/40% 40% 0 0;box-shadow:inset 0 18px 0 #a8e284"></div>`);
    // おうち
    add(`<svg class="abs" style="left:1060px;top:110px;width:720px;filter:drop-shadow(0 30px 30px rgba(120,60,0,.3))" viewBox="0 0 720 640">
      <path d="M60 300 L360 40 L660 300Z" fill="#ef6b4b" stroke="#fff" stroke-width="16" stroke-linejoin="round"/>
      <path d="M80 300 L80 620 L640 620 L640 300Z" fill="#fff6e6" stroke="#e7c69a" stroke-width="8"/>
      <path d="M230 130 L230 50 L180 50 L180 175" fill="#c9533a"/>
      <path d="M280 200 l14-40 l26 26 m90 14 l14-40 l26 26" fill="none"/>
      <rect x="300" y="420" width="120" height="200" rx="60" fill="#c78a4a"/><circle cx="395" cy="525" r="9" fill="#ffd84a"/>
      <rect x="130" y="370" width="120" height="110" rx="18" fill="#9fe6ff" stroke="#fff" stroke-width="12"/><path d="M190 370 v110 M130 425 h120" stroke="#fff" stroke-width="8"/>
      <rect x="470" y="370" width="120" height="110" rx="18" fill="#9fe6ff" stroke="#fff" stroke-width="12"/><path d="M530 370 v110 M470 425 h120" stroke="#fff" stroke-width="8"/>
      <path d="M300 150 L330 112 L352 150 M368 150 L390 112 L420 150" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      <rect x="300" y="150" width="120" height="70" rx="30" fill="#fff"/><rect x="314" y="162" width="92" height="46" rx="20" fill="#1d2433"/><circle cx="342" cy="185" r="7" fill="#4fd3e0"/><circle cx="378" cy="185" r="7" fill="#4fd3e0"/></svg>`);
    // 家具・つみ木
    [[1000, 640, 110, "#f2b134"], [1110, 680, 80, "#4fd3f0"], [1700, 650, 100, "#ff7eb6"], [1610, 700, 70, "#3cc47c"]].forEach(([x, y, s, c]) =>
      add(`<div class="abs" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:18px;background:${c};box-shadow:inset 0 -10px 0 rgba(0,0,0,.15),0 12px 14px rgba(0,0,0,.2);transform:rotate(${(x % 20) - 10}deg)"></div>`));
    logo([["チャッピー", "#ffffff", 150], ["home", "#ffb020", 210]], 175, 60, "#5a2e0a");
    rays(70, 60, [[0, 0, -30], [70, -30, -10], [-40, 70, -55, 70]]);
    plate("チャッピーの おうちを つくろう！", 130, 540);
    chappy(790, 380, 300, { wave: true });
    apple(940, 650, 90, 10);
    sparkles([[960, 110, 70], [1000, 330, 46], [1820, 90, 60]]);
  }
};
SCENES[g]();
document.fonts.ready.then(() => setTimeout(() => document.title = "READY", 300));
</script>
</body>
</html>
